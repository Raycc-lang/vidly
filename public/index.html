            restartPeerIce(peer, 'sustained disconnected');
        }
    }, 8000);
}

async function restartPeerIce(peer, reason) {
    const { pc } = peer;
    if (pc.signalingState !== 'stable' || peer.makingOffer) {
        schedulePeerIceRestart(peer);
        return;
    }
    console.warn('[WebRTC] ICE', reason, '- restarting');
    try { pc.restartIce(); } catch {}
    try {
        peer.makingOffer = true;
        await pc.setLocalDescription();
        sendSignal(peer.id, { description: pc.localDescription });
    } catch (e) {
        console.warn('[WebRTC] ICE restart negotiation failed', e);
    } finally {
        peer.makingOffer = false;
    }
}

function removePeer(peerId) {
    const peer = peers.get(peerId);
    if (!peer) return;
    cancelPeerIceRestart(peer);
    for (const [fileId, transfer] of incomingFiles) {
        if (transfer.peer === peer) incomingFiles.delete(fileId);
    }
    if (activeRemoteVideoPeerId === peerId) {
        activeRemoteVideoPeerId = null;
        activeRemoteVideoTrack = null;
    }
    if (activeRemoteCameraPeerId === peerId) clearRemoteCameraVideo(peer);
    hideStallOverlay(peer.tileEl);
    if (peer.audioEl) {
        try { peer.audioEl.pause(); } catch {}
        peer.audioEl.srcObject = null;
    }
    try { peer.pc.close(); } catch {}
    if (peer.tileEl && peer.tileEl.parentNode) peer.tileEl.parentNode.removeChild(peer.tileEl);
    peers.delete(peerId);
    layoutGrid();
}

function sendDataMessage(msg) {
    const data = JSON.stringify(msg);
    for (const peer of peers.values()) {
        if (peer.dc && peer.dc.readyState === 'open') {
            try { peer.dc.send(data); } catch {}
        }
    }
}

function sendPeerDataMessage(peer, msg) {
    if (peer?.dc?.readyState !== 'open') return false;
    try {
        peer.dc.send(JSON.stringify(msg));
        return true;
    } catch {
        return false;
    }
}

// ─── Tile / grid rendering ────────────────────────────────
function createTile(peerId, username) {
    const tile = document.createElement('div');
    tile.className = 'tile placeholder';
    tile.dataset.peerId = peerId;

    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    tile.appendChild(video);

    const audio = document.createElement('audio');
    audio.className = 'remote-audio';
    audio.autoplay = true;
    audio.playsInline = true;
    tile.appendChild(audio);

    const label = document.createElement('div');
    label.className = 'tile-label';
    const dot = document.createElement('span');
    dot.className = 'status-dot connecting';
    label.appendChild(dot);
    const txt = document.createElement('span');
    txt.textContent = username || ('Peer ' + peerId.slice(0, 4));
    label.appendChild(txt);
    tile.appendChild(label);

    grid.appendChild(tile);
    layoutGrid();
    return { tileEl: tile, videoEl: video, audioEl: audio, dot };
}

function layoutGrid() {
    const n = peers.size;
    grid.classList.remove('n2', 'n3', 'n4');
    if (n >= 2) grid.classList.add('n' + Math.min(n, 4));
}

function updateEmptyState() {
    emptyState.style.display = peers.size === 0 ? 'grid' : 'none';
}

// ─── DataChannel chat ─────────────────────────────────────
function attachDataChannel(peer, dc) {
    peer.dc = dc;
    dc.onopen = () => {
        // Send our current mic/cam state to this peer so they can render indicators.
        sendPeerDataMessage(peer, {
            type: 'media-state',
            mic: !!micEnabled,
            cam: !!camEnabled,
            video: !!(camEnabled || isSharing),
            screen: !!isSharing,
            username: myUsername
        });
    };
    dc.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        if (msg.username) peer.username = msg.username;
        if (msg.type === 'chat') {
            addMessage('other', msg.body, msg.ts, msg.username);
        } else if (msg.type === 'chat-edit') {
            applyChatEdit(msg.originalTs, msg.body);
        } else if (msg.type === 'media') {
            addMediaMessage('other', msg.url, msg.kind, msg.ts, msg.username);
        } else if (msg.type === 'reaction') {
            addReactionMessage('other', msg.emoji, msg.ts, msg.username || peer.username || 'Peer', peer.id);
        } else if (msg.type === 'media-state') {
            peer.mediaState = {
                mic: !!msg.mic,
                cam: !!msg.cam,
                video: Object.prototype.hasOwnProperty.call(msg, 'video') ? !!msg.video : !!msg.cam,
                screen: !!msg.screen
            };
            updatePeerStatusIndicator(peer.id, peer.mediaState.mic, peer.mediaState.cam, peer.mediaState.screen);
            if (!peer.mediaState.video) {
                clearAllRemoteVideo(peer);
            } else {
                if (!peer.mediaState.cam && peer.remoteCameraTrack) {
                    removeRemoteVideoTrack(peer, peer.remoteCameraTrack);
                }
                if (!peer.mediaState.screen && peer.remoteScreenTrack) {
                    removeRemoteVideoTrack(peer, peer.remoteScreenTrack);
                }
                // Remote may have toggled its camera off then on. With a
                // stable RtpSender (no renegotiation) the receiver track
                // identity is unchanged, so pc.ontrack does NOT refire. We
                // previously nulled remoteCameraTrack on cam:false above, so
                // find a live video receiver that isn't the screen track and
                // re-bind it now that the remote is sending again.
                if (peer.mediaState.cam && !peer.remoteCameraTrack) {
                    const cameraTrack = peer.pc.getReceivers()
                        .map(r => r.track)
                        .find(t => t && t.kind === 'video' &&
                                   t.readyState === 'live' &&
                                   t !== peer.remoteScreenTrack);
                    if (cameraTrack) {
                        peer.remoteCameraTrack = cameraTrack;
                        renderRemoteCameraTrack(peer);
                    }
                }
                if (peer.mediaState.screen && !peer.remoteScreenTrack) {
                    const screenTrack = peer.pc.getReceivers()
                        .map(r => r.track)
                        .find(t => t && t.kind === 'video' &&
                                   t.readyState === 'live' &&
                                   t !== peer.remoteCameraTrack);
                    if (screenTrack) {
                        peer.remoteScreenTrack = screenTrack;
                        renderRemoteVideoTrack(peer);
                    }
                }
            }
        } else if (msg.type && msg.type.startsWith('file-')) {
            handleFileControl(peer, msg);
        }
    };
    dc.onclose = () => {};
}

function attachFileDataChannel(peer, dc) {
    peer.fileDc = dc;
    dc.binaryType = 'arraybuffer';
    dc.bufferedAmountLowThreshold = FILE_BUFFER_LOW;
    dc.onmessage = (e) => handleFileChunk(peer, e.data);
    dc.onclose = () => {};
}

function fileId() {
    return 'file-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}

function formatBytes(bytes) {
    if (!bytes) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let value = bytes;
    let i = 0;
    while (value >= 1024 && i < units.length - 1) {
        value /= 1024;
        i++;
    }
    return (value >= 10 || i === 0 ? value.toFixed(0) : value.toFixed(1)) + ' ' + units[i];
}

function isImageFile(meta) {
    return (meta.type || '').startsWith('image/');
}

function createFileCard(kind, meta, opts = {}) {
    const el = document.createElement('div');
    el.className = 'msg file ' + kind;
    appendSenderName(el, kind, opts.senderName);

    const card = document.createElement('div');
    card.className = 'file-card';

    const row = document.createElement('div');
    row.className = 'file-row';
    const icon = document.createElement('div');
    icon.className = 'file-icon';
    icon.textContent = isImageFile(meta) ? '🖼️' : '📄';
    row.appendChild(icon);

    const info = document.createElement('div');
    info.className = 'file-info';
    const name = document.createElement('div');
    name.className = 'file-name';
    name.textContent = meta.name || 'Untitled file';
    const size = document.createElement('div');
    size.className = 'file-size';
    size.textContent = formatBytes(meta.size || 0);
    info.appendChild(name);
    info.appendChild(size);
    row.appendChild(info);
    card.appendChild(row);

    const status = document.createElement('div');
    status.className = 'file-status';
    status.textContent = opts.status || '';
    card.appendChild(status);

    const progress = document.createElement('div');
    progress.className = 'file-progress';
    const bar = document.createElement('span');
    progress.appendChild(bar);
    if (opts.hideProgress) progress.style.display = 'none';
    card.appendChild(progress);

    const actions = document.createElement('div');
    actions.className = 'file-actions';
    if (opts.actions) {
        for (const action of opts.actions) actions.appendChild(action);
    }
    if (!actions.childNodes.length) actions.style.display = 'none';
    card.appendChild(actions);

    const preview = document.createElement('div');
    card.appendChild(preview);

    el.appendChild(card);
    appendMessageTime(el, opts.ts);
    return { el, status, bar, actions, preview };
}

function setFileProgress(card, loaded, total) {
    const pct = total ? Math.max(0, Math.min(100, Math.round((loaded / total) * 100))) : 0;
    card.bar.style.width = pct + '%';
}

function addCompletedFileMessage(kind, meta, blobOrUrl, ts, senderName) {
    const card = createFileCard(kind, meta, { ts, senderName, hideProgress: true, status: 'Complete' });
    const url = typeof blobOrUrl === 'string' ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    if (typeof blobOrUrl !== 'string') objectURLs.add(url);
    renderFilePreview(card, meta, url);
    messagesEl.appendChild(card.el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateChatCompact();
}

function renderFilePreview(card, meta, url) {
    card.preview.innerHTML = '';
    if (isImageFile(meta)) {
        const img = document.createElement('img');
        img.className = 'file-thumb';
        img.alt = meta.name || 'Shared image';
        img.src = url;
        card.preview.appendChild(img);
    } else {
        const link = document.createElement('a');
        link.className = 'file-download';
        link.href = url;
        link.download = meta.name || 'download';
        link.textContent = 'Download';
        card.preview.appendChild(link);
    }
}

function showPendingFile(file) {
    const pending = $('filePending');
    if (!pending) return;
    pending.innerHTML = '';
    pending.classList.add('open');

    const sendBtn = document.createElement('button');
    sendBtn.className = 'btn primary';
    sendBtn.type = 'button';
    sendBtn.textContent = 'Send';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn ghost';
    cancelBtn.type = 'button';
    cancelBtn.textContent = 'Cancel';
    const card = createFileCard('system', file, {
        status: 'Ready to send',
        hideProgress: true,
        actions: [cancelBtn, sendBtn]
    });
    pending.appendChild(card.el);

    let previewUrl = null;
    if (isImageFile(file)) {
        previewUrl = URL.createObjectURL(file);
        const img = document.createElement('img');
        img.className = 'file-thumb';
        img.alt = file.name;
        img.src = previewUrl;
        card.preview.appendChild(img);
    }

    cancelBtn.onclick = () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        pending.classList.remove('open');
        pending.innerHTML = '';
    };
    sendBtn.onclick = () => {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        pending.classList.remove('open');
        pending.innerHTML = '';
        startFileOffer(file);
    };
}

function startFileOffer(file) {
    const readyPeers = Array.from(peers.values()).filter(peer =>
        peer.dc?.readyState === 'open' && peer.fileDc?.readyState === 'open'
    );
    if (!readyPeers.length) {
        toast('No connected peers ready for file transfer', 'warn');
        return;
    }
    const id = fileId();
    const meta = { id, name: file.name, size: file.size, type: file.type || 'application/octet-stream', ts: Date.now(), username: myUsername };
    const card = createFileCard('own', meta, { status: 'Waiting for acceptance', ts: meta.ts });
    messagesEl.appendChild(card.el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateChatCompact();

    outgoingFiles.set(id, {
        file, meta, card,
        peers: new Set(readyPeers),
        accepted: new Set(),
        completed: new Set(),
        rejected: new Set()
    });
    for (const peer of readyPeers) {
        sendPeerDataMessage(peer, { type: 'file-offer', file: meta });
    }
}

function handleFileControl(peer, msg) {
    if (msg.type === 'file-offer' && msg.file) {
        receiveFileOffer(peer, msg.file);
    } else if (msg.type === 'file-accept') {
        const transfer = outgoingFiles.get(msg.id);
        if (!transfer || transfer.accepted.has(peer)) return;
        transfer.accepted.add(peer);
        transfer.card.status.textContent = 'Sending...';
        sendFileToPeer(peer, transfer).catch(() => {
            transfer.card.status.textContent = 'Transfer failed';
        });
    } else if (msg.type === 'file-reject') {
        const transfer = outgoingFiles.get(msg.id);
        if (!transfer) return;
        transfer.rejected.add(peer);
        transfer.card.status.textContent = 'Declined by ' + (peer.username || 'peer');
    } else if (msg.type === 'file-progress') {
        const transfer = outgoingFiles.get(msg.id);
        if (!transfer) return;
        setFileProgress(transfer.card, msg.received || 0, transfer.file.size);
        transfer.card.status.textContent = 'Sending ' + Math.round(((msg.received || 0) / transfer.file.size) * 100) + '%';
    } else if (msg.type === 'file-complete') {
        const transfer = outgoingFiles.get(msg.id);
        if (!transfer) return;
        transfer.completed.add(peer);
        setFileProgress(transfer.card, transfer.file.size, transfer.file.size);
        const done = transfer.completed.size;
        const total = transfer.peers.size;
        transfer.card.status.textContent = done === total ? 'Sent' : 'Sent to ' + done + ' of ' + total;
        if (done + transfer.rejected.size >= total) {
            transfer.card.bar.parentElement.style.display = 'none';
            const previewUrl = URL.createObjectURL(transfer.file);
            objectURLs.add(previewUrl);
            renderFilePreview(transfer.card, transfer.meta, previewUrl);
            outgoingFiles.delete(msg.id);
        }
    } else if (msg.type === 'file-empty') {
        completeIncomingFile(peer, msg.id);
    }
}

function receiveFileOffer(peer, meta) {
    if (incomingFiles.has(meta.id)) return;
    const card = createFileCard('other', meta, {
        senderName: meta.username || peer.username,
        ts: meta.ts,
        status: 'Receiving...',
        hideProgress: false
    });
    messagesEl.appendChild(card.el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateChatCompact();

    const transfer = { peer, meta, chunks: [], received: 0, card, lastProgressSent: 0, startedAt: performance.now() };
    incomingFiles.set(meta.id, transfer);

    if (peer.activeIncomingFileId) {
        incomingFiles.delete(meta.id);
        card.status.textContent = 'Busy receiving another file';
        sendPeerDataMessage(peer, { type: 'file-reject', id: meta.id });
        return;
    }

    peer.activeIncomingFileId = meta.id;
    sendPeerDataMessage(peer, { type: 'file-accept', id: meta.id });
}

async function sendFileToPeer(peer, transfer) {
    const dc = peer.fileDc;
    if (!dc || dc.readyState !== 'open') throw new Error('file channel is closed');
    if (transfer.file.size === 0) {
        sendPeerDataMessage(peer, { type: 'file-empty', id: transfer.meta.id });
        return;
    }
    // Clamp chunk size to the negotiated SCTP message size, defensively.
    const maxMsg = peer.pc?.sctp?.maxMessageSize | 0;
    const chunkSize = (maxMsg > 0 && maxMsg < FILE_CHUNK_SIZE) ? maxMsg : FILE_CHUNK_SIZE;
    const size = transfer.file.size;
    // Prefetch the first chunk so disk I/O overlaps with the wait-for-buffer.
    let offset = 0;
    let pending = transfer.file.slice(0, Math.min(chunkSize, size)).arrayBuffer();
    // Lightweight metrics — one summary line per transfer.
    const t0 = performance.now();
    let waitMs = 0;
    let readMs = 0;
    while (offset < size) {
        if (dc.readyState !== 'open') throw new Error('file channel is closed');
        const readStart = performance.now();
        const chunk = await pending;
        readMs += performance.now() - readStart;
        const nextOff = offset + chunk.byteLength;
        // Kick off the next disk read BEFORE awaiting backpressure, so it overlaps.
        pending = nextOff < size
            ? transfer.file.slice(nextOff, Math.min(nextOff + chunkSize, size)).arrayBuffer()
            : null;
        const waitStart = performance.now();
        await waitForFileBuffer(dc);
        waitMs += performance.now() - waitStart;
        if (dc.readyState !== 'open') throw new Error('file channel is closed');
        dc.send(chunk);
        offset = nextOff;
    }
    const totalMs = performance.now() - t0;
    const mbps = (size * 8) / (totalMs * 1000); // bits/us == Mb/s
    console.log(
        `[file-send] ${transfer.meta.name} ${formatBytes(size)} in ${totalMs.toFixed(0)}ms ` +
        `→ ${mbps.toFixed(1)} Mb/s | chunk=${chunkSize} read=${readMs.toFixed(0)}ms wait=${waitMs.toFixed(0)}ms`
    );
}

function waitForFileBuffer(dc) {
    if (dc.bufferedAmount <= FILE_BUFFER_HIGH) return Promise.resolve();
    return new Promise((resolve) => {
        let poll = null;
        const done = () => {
            dc.removeEventListener('bufferedamountlow', done);
            if (poll) clearInterval(poll);
            resolve();
        };
        // Trust the `bufferedamountlow` event in foreground tabs; keep a long-interval
        // poll only as a safety net for background-tab throttling or missed events.
        // (A short poll here previously injected up to 25ms of idle into every refill
        // cycle and was the dominant tail-latency cost on fast links.)
        poll = setInterval(() => {
            if (dc.bufferedAmount <= FILE_BUFFER_LOW || dc.readyState !== 'open') done();
        }, 250);
        dc.addEventListener('bufferedamountlow', done);
    });
}

function handleFileChunk(peer, data) {
    if (!(data instanceof ArrayBuffer)) return;
    let transfer = incomingFiles.get(peer.activeIncomingFileId);
    if (!transfer || transfer.peer !== peer) transfer = null;
    if (!transfer) return;
    transfer.chunks.push(data);
    transfer.received += data.byteLength;
    setFileProgress(transfer.card, transfer.received, transfer.meta.size);
    transfer.card.status.textContent = 'Receiving ' + Math.round((transfer.received / transfer.meta.size) * 100) + '%';

    const now = Date.now();
    if (now - transfer.lastProgressSent > 250 || transfer.received >= transfer.meta.size) {
        transfer.lastProgressSent = now;
        sendPeerDataMessage(peer, { type: 'file-progress', id: transfer.meta.id, received: transfer.received });
    }
    if (transfer.received >= transfer.meta.size) {
        completeIncomingFile(peer, transfer.meta.id);
    }
}

function completeIncomingFile(peer, id) {
    const transfer = incomingFiles.get(id);
    if (!transfer || transfer.peer !== peer) return;
    const blob = new Blob(transfer.chunks, { type: transfer.meta.type || 'application/octet-stream' });
    const totalMs = performance.now() - (transfer.startedAt || performance.now());
    const bytes = transfer.received || transfer.meta.size || 0;
    const mbps = totalMs > 0 ? (bytes * 8) / (totalMs * 1000) : 0;
    console.log(
        `[file-recv] ${transfer.meta.name} ${formatBytes(bytes)} in ${totalMs.toFixed(0)}ms ` +
        `→ ${mbps.toFixed(1)} Mb/s | chunks=${transfer.chunks.length}`
    );
    transfer.card.el.remove();
    incomingFiles.delete(transfer.meta.id);
    if (peer.activeIncomingFileId === transfer.meta.id) peer.activeIncomingFileId = null;
    addCompletedFileMessage('other', transfer.meta, blob, Date.now(), transfer.meta.username || peer.username);
    sendPeerDataMessage(peer, { type: 'file-complete', id: transfer.meta.id });
    toast('Received ' + transfer.meta.name, 'success');
}

function broadcastChat(text) {
    const msg = { type: 'chat', body: text, ts: Date.now(), username: myUsername };
    sendDataMessage(msg);
}

function broadcastMedia(url, kind) {
    const msg = { type: 'media', url, kind, ts: Date.now(), username: myUsername };
    sendDataMessage(msg);
    addMediaMessage('own', url, kind, msg.ts);
}

function broadcastReaction(emoji) {
    const msg = { type: 'reaction', emoji, ts: Date.now(), username: myUsername };
    sendDataMessage(msg);
    addReactionMessage('own', emoji, msg.ts);
}

function detectMedia(text) {
    const url = text.trim();
    if (MEDIA_URL_RE.test(url)) {
        const kind = /\.gif(?:\?\S*)?$/i.test(url) ? 'gif' : 'image';
        return { url, kind };
    }
    if (GIF_SERVICE_RE.test(url)) return { url, kind: 'gif' };
    return null;
}

// ─── Chat history (localStorage) ─────────────────────────
function chatKey() { return 'vidly-chat-' + roomId; }

function saveChatMsg(msg) {
    if (!roomId || loadingHistory) return;
    try {
        const arr = JSON.parse(localStorage.getItem(chatKey()) || '[]');
        arr.push(msg);
        if (arr.length > CHAT_MAX) arr.splice(0, arr.length - CHAT_MAX);
        localStorage.setItem(chatKey(), JSON.stringify(arr));
    } catch {}
}

function loadChatHistory() {
    if (!roomId) return;
    loadingHistory = true;
    try {
        const arr = JSON.parse(localStorage.getItem(chatKey()) || '[]');
        for (const m of arr) {
            if (m.type === 'chat') addMessage(m.kind, m.body, m.ts, m.senderName);
            else if (m.type === 'media') addMediaMessage(m.kind, m.url, m.mediaKind, m.ts, m.senderName);
            else if (m.type === 'reaction') addReactionMessage(m.kind, m.emoji, m.ts, m.senderName);
        }
    } catch {}
    loadingHistory = false;
}

function addMessage(kind, body, ts, senderName) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    if (ts) el.dataset.ts = ts;
    // Show sender name for incoming messages
    if (kind === 'other' && senderName) {
        const nameEl = document.createElement('div');
        nameEl.className = 'meta';
        nameEl.textContent = senderName;
        nameEl.style.marginBottom = '4px';
        nameEl.style.marginTop = '0';
        nameEl.style.color = 'var(--accent)';
        el.appendChild(nameEl);
    }
    const bodyEl = document.createElement('span');
    bodyEl.className = 'msg-body';
    bodyEl.textContent = body;
    el.appendChild(bodyEl);
    if (ts) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        const d = new Date(ts);
        meta.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        el.appendChild(meta);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (kind === 'own' || kind === 'other') {
        updateChatCompact();
        saveChatMsg({ type: 'chat', kind, body, ts, senderName });
    }
}

function applyChatEdit(originalTs, body) {
    if (!originalTs) return;
    const el = messagesEl.querySelector('.msg[data-ts="' + originalTs + '"]');
    if (el) {
        const bodyEl = el.querySelector('.msg-body');
        if (bodyEl) bodyEl.textContent = body;
    }
    try {
        const arr = JSON.parse(localStorage.getItem(chatKey()) || '[]');
        let changed = false;
        for (const m of arr) {
            if (m.type === 'chat' && m.ts === originalTs) { m.body = body; changed = true; }
        }
        if (changed) localStorage.setItem(chatKey(), JSON.stringify(arr));
    } catch {}
}

function appendSenderName(el, kind, senderName) {
    if (kind !== 'other' || !senderName) return;
    const nameEl = document.createElement('div');
    nameEl.className = 'meta';
    nameEl.textContent = senderName;
    nameEl.style.marginBottom = '4px';
    nameEl.style.marginTop = '0';
    nameEl.style.color = 'var(--accent)';
    el.appendChild(nameEl);
}

function appendMessageTime(el, ts) {
    if (!ts) return;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const d = new Date(ts);
    meta.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    el.appendChild(meta);
}

function addMediaMessage(kind, url, mediaKind, ts, senderName) {
    const el = document.createElement('div');
    el.className = 'msg media ' + kind;
    appendSenderName(el, kind, senderName);

    const wrap = document.createElement('div');
    wrap.className = 'media-wrap';
    const loading = document.createElement('div');
    loading.className = 'media-loading';
    loading.textContent = 'Loading media…';
    wrap.appendChild(loading);

    const img = document.createElement('img');
    img.className = 'chat-media';
    img.alt = mediaKind === 'gif' ? 'Shared GIF' : 'Shared image';
    img.loading = 'lazy';
    img.onload = () => loading.remove();
    img.onerror = () => {
        img.remove();
        loading.remove();
        const fallback = document.createElement('a');
        fallback.className = 'media-fallback';
        fallback.href = url;
        fallback.target = '_blank';
        fallback.rel = 'noopener noreferrer';
        fallback.textContent = url;
        wrap.appendChild(fallback);
    };
    img.src = url;
    wrap.appendChild(img);
    el.appendChild(wrap);
    appendMessageTime(el, ts);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateChatCompact();
    saveChatMsg({ type: 'media', kind, url, mediaKind, ts, senderName });
}

function addReactionMessage(kind, emoji, ts, senderName, fromPeerId) {
    if (!emoji) return;
    const el = document.createElement('div');
    el.className = 'msg reaction';
    const nameEl = document.createElement('span');
    nameEl.textContent = kind === 'own' ? 'You' : (senderName || 'Peer');
    const emojiEl = document.createElement('span');
    emojiEl.className = 'reaction-emoji';
    emojiEl.textContent = emoji;
    el.appendChild(nameEl);
    el.appendChild(emojiEl);
    if (ts) el.title = new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    updateChatCompact();
    saveChatMsg({ type: 'reaction', kind, emoji, ts, senderName });
}

    const peer = peers.get(peerId);
    if (!peer || !peer.tileEl) return;
    const label = peer.tileEl.querySelector(".tile-label");

function broadcastLocalMediaState() {
    sendDataMessage({
        type: 'media-state',

function updateChatCompact() {
    const compact = $('chatCompact');
    if (!compact) return;
    // Don't update while chat is open (user is reading full messages)
    if ($('chat').classList.contains('open')) return;

    compact.innerHTML = '';
    // Show last 3 messages
    const msgs = messagesEl.querySelectorAll('.msg.own, .msg.other');
    const last2 = Array.from(msgs).slice(-3);
    if (last2.length === 0) {
        compact.textContent = 'No messages yet';
        return;
    }
    for (const m of last2) {
        const row = document.createElement('div');
        row.className = 'cc-msg';
        const sender = m.classList.contains('own') ? 'You' :
            (m.querySelector('.meta')?.textContent || 'Peer');
        const body = m.classList.contains('media') ? '[media]' :
            (m.classList.contains('file') ? '[file] ' + (m.querySelector('.file-name')?.textContent || '') :
            (m.querySelector('span:not(.meta)')?.textContent || ''));
        const s = document.createElement('span');
        s.className = 'cc-sender';
        s.textContent = sender + ':';
        row.appendChild(s);
        const t = document.createElement('span');
        t.textContent = body.length > 50 ? body.slice(0, 50) + '…' : body;
        row.appendChild(t);
        compact.appendChild(row);
    }
}

function initStickerPicker() {
    const picker = $('stickerPicker');
    if (!picker) return;

    let debounceTimer = null;
    let requestId = 0;
    let lastGifs = [];

    const search = document.createElement('input');
    search.type = 'search';
    search.className = 'gif-search';
    search.placeholder = 'Search GIPHY';
    search.autocomplete = 'off';

    const grid = document.createElement('div');
    grid.className = 'gif-grid';

    picker.replaceChildren(search, grid);

    const sendGif = (url) => {
        broadcastMedia(url, 'gif');
        closeStickerPicker();
        $('chatInput').focus();
    };

    const setState = (message) => {
        grid.innerHTML = '';
        grid.className = 'gif-grid';
        const state = document.createElement('div');
        state.className = 'gif-state';
        state.textContent = message;
        grid.appendChild(state);
    };

    const gifUrl = (gif) => (
        gif?.images?.original?.url ||
        gif?.images?.downsized_medium?.url ||
        gif?.images?.fixed_width_small?.url
    );

    const renderGifPreview = (gif) => {
        const url = gifUrl(gif);
        if (!url) return;
        grid.innerHTML = '';
        grid.className = 'gif-preview';

        if (gif.title) {
            const title = document.createElement('div');
            title.className = 'gif-preview-title';
            title.textContent = gif.title;
            grid.appendChild(title);
        }

        const img = document.createElement('img');
        img.className = 'gif-preview-image';
        img.src = url;
        img.alt = gif.title || 'GIPHY GIF preview';
        img.addEventListener('click', () => sendGif(url));
        grid.appendChild(img);

        const actions = document.createElement('div');
        actions.className = 'gif-preview-actions';

        const back = document.createElement('button');
        back.type = 'button';
        back.className = 'btn ghost';
        back.textContent = 'Back';
        back.addEventListener('click', () => renderGifs(lastGifs));

        const send = document.createElement('button');
        send.type = 'button';
        send.className = 'btn primary';
        send.textContent = 'Send';
        send.addEventListener('click', () => sendGif(url));

        actions.append(back, send);
        grid.appendChild(actions);
    };

    const hasHover = window.matchMedia('(hover: hover)').matches;
    const renderGifs = (gifs) => {
        grid.innerHTML = '';
        grid.className = 'gif-grid';
        lastGifs = gifs;
        if (!gifs.length) {
            setState('No results');
            return;
        }
        for (const gif of gifs) {
            const url = gifUrl(gif);
            const thumb = gif?.images?.fixed_width_small?.url;
            if (!url || !thumb) continue;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sticker-option';
            btn.title = gif.title || 'GIPHY GIF';

            const img = document.createElement('img');
            img.src = thumb;
            img.alt = gif.title || 'GIPHY GIF';
            img.loading = 'lazy';

            btn.appendChild(img);
            btn.addEventListener('click', () => {
                if (hasHover) sendGif(url);
                else renderGifPreview(gif);
            });
            grid.appendChild(btn);
        }
        if (!grid.children.length) setState('No results');
    };

    const fetchGifs = async (query = '') => {
        const currentRequest = ++requestId;
        setState('Loading...');
        // Route through our own server (/giphy proxy) — api.giphy.com is blocked
        // on some client networks. Response is GIPHY's JSON, parsed unchanged.
        const trimmedQuery = query.trim();
        const params = new URLSearchParams({ rating: 'g' });
        if (trimmedQuery) params.set('q', trimmedQuery);

        try {
            const res = await fetch(`/giphy?${params}`);
            if (!res.ok) throw new Error('GIPHY request failed');
            const json = await res.json();
            if (currentRequest !== requestId) return;
            renderGifs(Array.isArray(json.data) ? json.data : []);
        } catch (err) {
            if (currentRequest === requestId) setState('No results');
        }
    };

    search.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => fetchGifs(search.value), 300);
    });

    search.addEventListener('click', (e) => e.stopPropagation());
    grid.addEventListener('click', (e) => e.stopPropagation());

    fetchGifs();

    $('stickerBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = picker.classList.toggle('open');
        $('reactionPanel')?.classList.remove('open');
        if (isOpen) {
            positionStickerPicker();
            search.focus();
        }
    });
}

function closeStickerPicker() {
    $('stickerPicker')?.classList.remove('open');
}

function positionStickerPicker() {
    const picker = $('stickerPicker');
    if (!picker) return;
    picker.classList.remove('below');

$('micBtn').onclick = async () => {
    if (micEnabled) {
        // Turn mic off
        micEnabled = false;
        // Detach mic from the screen-audio mixer first so the underlying track
        // can be stopped without leaving a dead source node hanging on.
        if (audioMixer) setMixerMicTrack(null);
        if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = false; });
        $('micBtn').classList.add('muted');
        $('micBtn').textContent = '🔇';
    } else {
        // Turn mic on — camera is off, so request audio-only stream
        if (!camEnabled) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                micEnabled = true;
                const audioTrack = micStream.getAudioTracks()[0];
                if (audioMixer) {
                    // Mixer owns the sender's track during screen share.
                    // Add the new mic into the mix; do NOT replace the sender's track.
                    setMixerMicTrack(audioTrack);
                } else {
                    for (const peer of peers.values()) {
                        const sender = findSenderByKind(peer.pc, 'audio');
                        if (sender) {
                            try { sender.replaceTrack(audioTrack); } catch {}
                        } else if (audioTrack) {
                            try { peer.pc.addTrack(audioTrack, micStream); } catch {}
                        }
                    }
                }
            } catch (err) {
                console.error('[WebRTC] mic getUserMedia failed', err);
                toast('Could not access microphone: ' + (err.message || err.name), 'error');
                return;
            }
        } else {
            // Camera is on — just re-enable existing audio tracks
            micEnabled = true;
            if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = true; });
            // Reattach mic to the mixer if screen share is active (it was
            // detached when mic turned off so the source node didn't dangle).
            if (audioMixer) {
                const reAttach = (localStream && localStream.getAudioTracks()[0])
                    || (micStream && micStream.getAudioTracks()[0]);
                if (reAttach) setMixerMicTrack(reAttach);
            }
        }
        $('micBtn').classList.remove('muted');
        $('micBtn').textContent = '🎙️';
    }
    broadcastLocalMediaState();
};
$('camBtn').onclick = () => {
    if (!camEnabled) {

    } else {
        // Turn camera off

        // Stop camera tracks
        if (cameraStream && cameraStream !== localStream) {

        }
        if (localStream) localStream.getVideoTracks().forEach(t => t.stop());
        // Stop sending video without renegotiating.

        if (micEnabled && micStream) {

        }

};

async function startScreenShare() {
    try {
        screenStream = await navigator.mediaDevices.getDisplayMedia({
            video: {
                frameRate: { ideal: 15, max: 30 },
                width: { max: 1920 },
                height: { max: 1080 }
            },
            audio: ENABLE_SCREEN_AUDIO
        });
    } catch (err) {
        toast('Could not start screen share: ' + (err.message || err.name), 'error');
        return;
    }
    const screenTrack = screenStream.getVideoTracks()[0];
    try { screenTrack.contentHint = 'detail'; } catch {}
    try { await screenTrack.applyConstraints({ frameRate: { max: 30 } }); } catch {}

    // Publish screen share as a separate video sender. Keeping camera on its own
    // sender forces renegotiation and lets receivers initialize a distinct decoder.
    for (const peer of peers.values()) {
        if (peer.screenSender) {
            try { await peer.screenSender.replaceTrack(screenTrack); } catch (e) { console.warn(e); }
        } else {
            try { peer.screenSender = peer.pc.addTrack(screenTrack, screenStream); } catch (e) { console.warn(e); }
        }
    }

    // Send screen audio mixed with mic on the already-negotiated audio sender.
    // Mic + screen audio are summed in a Web Audio graph and the resulting
    // MediaStreamTrack rides the existing sender via replaceTrack(). No SDP
    // renegotiation, single Opus stream out, no remote-side changes.
    screenAudioTrack = ENABLE_SCREEN_AUDIO ? (screenStream.getAudioTracks()[0] || null) : null;
    if (screenAudioTrack) {
        const micTrack = getActiveAudioTrack();
        audioMixer = createAudioMixer(micTrack, screenAudioTrack);
        if (audioMixer && audioMixer.mixedTrack) {
            for (const peer of peers.values()) {
                const sender = findSenderByKind(peer.pc, 'audio');
                if (sender) {
                    try { await sender.replaceTrack(audioMixer.mixedTrack); } catch (e) { console.warn(e); }
                } else {
                    console.warn('[ScreenShare] screen audio available but no negotiated audio sender exists');
                }
            }
        } else {
            // Fallback: mixer construction failed → screen audio only on sender
            for (const peer of peers.values()) {
                const sender = findSenderByKind(peer.pc, 'audio');
                if (sender) {
                    try { await sender.replaceTrack(screenAudioTrack); } catch (e) { console.warn(e); }
                }
            }
        }
        // If screen audio track ends on its own, drop it from the mix so the
        // mic continues uninterrupted on the sender.
        screenAudioTrack.addEventListener('ended', () => {
            if (audioMixer) setMixerScreenTrack(null);
        });
    }

    // Show local screen preview (un-mirrored).
    localVideo.srcObject = screenStream;
    localTile.style.display = '';
    updatePreviewDockVisibility();
    localVideo.style.display = '';
    localPlaceholder.classList.add('hidden');
    localTile.classList.add('screensharing');
    isSharing = true;
    $('screenBtn').classList.add('active');
    broadcastLocalMediaState();

    // Auto-revert when user clicks "Stop sharing" in the browser UI.
    screenTrack.onended = () => {
        console.log('[ScreenShare] track ended, reverting');
        stopScreenShare();
    };

    // Periodic liveness check — catches silent track death (browser kills capture,
    // tab discarded, OS power management) where onended doesn't fire reliably.
    if (screenTrackCheck) clearInterval(screenTrackCheck);
    screenTrackCheck = setInterval(() => {
        if (!isSharing) { clearInterval(screenTrackCheck); screenTrackCheck = null; return; }
        if (screenTrack.readyState === 'ended') {
            console.warn('[ScreenShare] track ended silently, reverting');
            clearInterval(screenTrackCheck);
            screenTrackCheck = null;
            stopScreenShare();
        }
    }, 3000);
}

async function stopScreenShare() {
    // Clear liveness check interval.
    if (screenTrackCheck) { clearInterval(screenTrackCheck); screenTrackCheck = null; }

    // Restore the previous mic/camera audio sender. This avoids addTrack/removeTrack
    // and keeps screen-share stop from triggering renegotiation.
    if (screenAudioTrack || audioMixer) {
        const restoreAudioTrack = getActiveAudioTrack();
        for (const peer of peers.values()) {
            const sender = findSenderByKind(peer.pc, 'audio');
            if (sender) {
                try { await sender.replaceTrack(restoreAudioTrack); } catch (e) { console.warn(e); }
            }
        }
        screenAudioTrack = null;
        await destroyAudioMixer();
    }
    for (const peer of peers.values()) {
        if (!peer.screenSender) continue;
        try { peer.pc.removeTrack(peer.screenSender); } catch (e) { console.warn(e); }
        peer.screenSender = null;
    }
    if (screenStream) {
        screenStream.getVideoTracks().forEach(t => { t.onended = null; });
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
    }
    if (camEnabled) {
        const camTrack = cameraStream && cameraStream.getVideoTracks()[0];
        // Guard against stale camera track (e.g. camera ended while screen sharing).
        if (camTrack && camTrack.readyState === 'ended') {
            console.warn('[ScreenShare] camera track ended while sharing, reverting to no-video');
            camEnabled = false;
            cameraStream = null;
        }
        const activeCamTrack = getActiveCameraTrack();
        if (activeCamTrack) {
            localVideo.srcObject = cameraStream;
            localTile.style.display = '';
            updatePreviewDockVisibility();
            localVideo.style.display = '';
            localPlaceholder.classList.add('hidden');
        } else {
            hideLocalVideoTile();
        }
    } else {
        // Camera was off — removing the screen sender leaves us with no outgoing video.
        hideLocalVideoTile();
    }
    localTile.classList.remove('screensharing');
    isSharing = false;
    $('screenBtn').classList.remove('active');
    broadcastLocalMediaState();
}

$('leaveBtn').onclick = leaveCall;

function leaveCall() {
    intentionalClose = true;
    stopWsHeartbeat();
    stopStallMonitor();
    if (screenTrackCheck) { clearInterval(screenTrackCheck); screenTrackCheck = null; }
    if (wakeLock) try { wakeLock.release(); } catch {}
    try { sendWs({ type: 'leave' }); } catch {}
    for (const id of Array.from(peers.keys())) removePeer(id);
    if (ws) try { ws.close(); } catch {}
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (screenStream) screenStream.getTracks().forEach(t => t.stop());
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (previewStream) previewStream.getTracks().forEach(t => t.stop());
    destroyAudioMixer();
    history.pushState({}, '', '/');
    location.reload();
}

window.addEventListener('beforeunload', () => {
    stopWsHeartbeat();
    stopStallMonitor();
    for (const url of objectURLs) URL.revokeObjectURL(url);
    objectURLs.clear();
    try { sendWs({ type: 'leave' }); } catch {}
    if (ws) try { ws.close(); } catch {}
});

// Re-acquire wake lock when page becomes visible (browser may release it)
document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible') {
        checkWebSocketHealth();
    }
    if (document.visibilityState === 'visible' && roomId && !wakeLock) {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            }
        } catch {}
    }
});

window.addEventListener('focus', checkWebSocketHealth);
window.addEventListener('pageshow', checkWebSocketHealth);

// ─── Chat panel toggle ────────────────────────────────────
function toggleChat() {
    const chat = $('chat');
    chat.classList.toggle('open');
    if (chat.classList.contains('open')) {
        // Scroll to bottom when opening
        messagesEl.scrollTop = messagesEl.scrollHeight;
    } else {
        // Update compact view when closing
        updateChatCompact();
    }
}
$('chatBtn').onclick = toggleChat;
$('closeChat').onclick = (e) => {
    e.stopPropagation();
    $('chat').classList.remove('open');
    updateChatCompact();
};
$('chat').addEventListener('click', (e) => {
    if (!$('chat').classList.contains('open')) {
        toggleChat();
    }
});

// ─── Copy invite link ─────────────────────────────────────
$('copyLink').onclick = async () => {
    const link = location.origin + '/room/' + roomId;
    try {
        await navigator.clipboard.writeText(link);
        toast('Invite link copied', 'success');
    } catch {
        prompt('Copy this invite link:', link);
    }
};
