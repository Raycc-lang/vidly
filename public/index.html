<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1117" />
<title>Vidly — Private Video Calls</title>
<style>
  /* ─── Tokens ───────────────────────────────────────────── */
  :root {
    --bg: #0f1117;
    --bg-grad: radial-gradient(1200px 800px at 80% -10%, #1c2236 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #1a1430 0%, transparent 55%),
               #0f1117;
    --card: #1a1d27;
    --card-2: #20242f;
    --border: #2a2f3d;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #8a6cff;
    --good: #34d399;
    --warn: #fbbf24;
    --bad:  #f87171;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                 Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }
  input, button { color: inherit; }

  /* ─── Landing ──────────────────────────────────────────── */
  #landing {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
  }
  .landing-card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
    animation: pop .5s cubic-bezier(.2,.9,.3,1.2);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px;
    font-weight: 600; font-size: 14px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(79, 140, 255, .7);
  }
  .title {
    font-size: 34px; font-weight: 700; line-height: 1.1; margin: 0 0 8px;
    background: linear-gradient(90deg, #fff, #b9c8ff 60%, #c4a8ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 18px;
    border: 1px solid transparent; border-radius: 10px;
    background: var(--card-2); color: var(--text);
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: transform .08s ease, background .15s ease, border-color .15s;
  }
  .btn:hover { background: #262b39; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none;
    box-shadow: 0 6px 20px rgba(79, 140, 255, .35);
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { background: #b13c3c; color: #fff; }
  .btn.danger:hover { background: #c84a4a; }
  .btn.ghost { background: transparent; border-color: var(--border); }
  .btn.ghost:hover { background: rgba(255,255,255,.04); }
  .btn.icon { width: 46px; padding: 0; font-size: 18px; }
  .btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; }

  .full { width: 100%; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px;
    margin: 22px 0;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  .input {
    width: 100%; height: 46px; padding: 0 14px;
    background: #12151c; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.2); }
  .row { display: flex; gap: 10px; }

  .footer-note { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }

  /* ─── Call screen ──────────────────────────────────────── */
  #call { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  #call.active { display: flex; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    background: rgba(15, 17, 23, .65);
    z-index: 5;
  }
  .room-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
  }
  .room-pill code { color: var(--accent); font-family: "SF Mono", ui-monospace, monospace; }
  .copy-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 12px;
  }
  .copy-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .top-actions { display: flex; gap: 8px; }

  .stage {
    flex: 1; display: flex; min-height: 0; position: relative;
  }
  .grid-wrap {
    flex: 1; min-width: 0; min-height: 0;
    padding: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    width: 100%; height: 100%;
    display: grid; gap: 14px;
    grid-template-columns: 1fr;
    grid-auto-rows: 1fr;
  }
  .grid.n2 { grid-template-columns: repeat(2, 1fr); }
  .grid.n3, .grid.n4 { grid-template-columns: repeat(2, 1fr); }

  .tile {
    position: relative; overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: fadein .3s ease both;
    aspect-ratio: 16 / 9;
    max-height: 100%;
    align-self: center; justify-self: center;
    width: 100%;
  }
  .tile video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  .tile audio.remote-audio {
    position: absolute;
    width: 0;
    height: 0;
    opacity: 0;
    pointer-events: none;
  }
  .tile.placeholder::after {
    content: "Waiting for video…";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); font-size: 13px;
  }
  .tile.placeholder video {
    display: none;
  }
  .stall-overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(0, 0, 0, .46);
    color: var(--text); font-size: 13px;
    pointer-events: none;
    z-index: 2;
  }
  .stall-overlay::after {
    content: "Buffering...";
  }
  .tile-label {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
    padding: 6px 10px; border-radius: 8px;
    font-size: 12px; color: #fff;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
    box-shadow: 0 0 6px currentColor;
  }
  .status-dot.connected { background: var(--good); color: var(--good); }
  .status-dot.connecting { background: var(--warn); color: var(--warn); }
  .status-dot.failed { background: var(--bad); color: var(--bad); }

  .empty-state {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); pointer-events: none;
  }
  .empty-state .icon { font-size: 42px; margin-bottom: 10px; opacity: .6; }

  /* Floating preview/camera PiP dock */
  #previewDock {
    position: fixed;
    right: 22px; bottom: 110px;
    display: flex; align-items: flex-start; gap: 10px;
    border-radius: 12px; overflow: hidden;
    z-index: 6;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #previewDock.dragging { cursor: grabbing; transition: none !important; }
  #previewDock:not(.dragging) { transition: right .2s ease, bottom .2s ease; }
  .preview-tile {
    position: relative;
    width: 350px; min-height: 100px; aspect-ratio: 16/9;
    border-radius: 12px; overflow: hidden;
    background: #000; border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
  }
  .preview-tile video {
    width: 100%; height: 100%; object-fit: contain;
  }
  #localTile video {
    transform: scaleX(-1); /* mirror */
  }
  #localTile.screensharing video { transform: none; }
  .preview-tile .tile-label { font-size: 11px; padding: 4px 8px; left: 8px; bottom: 8px; }
  #remoteCameraTile { display: none; }
  /* Resize handles — invisible, positioned at corners */
  .resize-handle {
    position: absolute;
    width: 24px; height: 24px;
    z-index: 10;
    /* debug: background: rgba(255,0,0,.3); */
  }
  .resize-handle.nw { top: 0; left: 0; cursor: nw-resize; }
  .resize-handle.ne { top: 0; right: 0; cursor: ne-resize; }
  .resize-handle.sw { bottom: 0; left: 0; cursor: sw-resize; }
  .resize-handle.se { bottom: 0; right: 0; cursor: se-resize; }

  /* Local PiP placeholder */
  #localPlaceholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    z-index: 2;
  }
  #localPlaceholder.hidden { display: none; }
  #localAvatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  #localPlaceholder .cam-on-btn {
    padding: 6px 14px; border-radius: 8px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; cursor: pointer;
    transition: background .15s;
  }
  #localPlaceholder .cam-on-btn:hover { background: rgba(255,255,255,.14); }
  #previewBtns {
    position: absolute; inset: 0; bottom: 0;
    display: none; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 8px; gap: 6px;
    background: linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.4) 50%, transparent 100%);
    z-index: 3;
  }
  #previewBtns.active { display: flex; }
  #previewBtns .btn-row { display: flex; gap: 6px; align-items: center; }
  #previewBtns .btn-row button {
    padding: 5px 12px; border-radius: 6px; border: none;
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: filter .15s;
    display: inline-flex; align-items: center; gap: 4px;
    backdrop-filter: blur(4px);
  }
  #previewBtns .btn-row button:hover { filter: brightness(1.1); }
  #previewBtns .confirm-btn { background: var(--good); color: #000; }
  #previewBtns .cancel-btn { background: var(--bad); color: #fff; }
  #previewBtns .switch-cam-btn {
    background: rgba(255,255,255,.2); color: #fff;
    border: 1px solid rgba(255,255,255,.3);
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: rgba(15, 17, 23, .85);
    backdrop-filter: blur(10px);
    z-index: 7;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
  }
  .toolbar .btn.icon { height: 50px; width: 50px; font-size: 20px; border-radius: 12px; }
  .toolbar .btn.icon.muted { background: #3a2222; color: #ffb4b4; }
  .floating-panel {
    position: fixed;
    left: 50%; bottom: 86px;
    transform: translateX(-50%);
    z-index: 30;
    display: none;
    background: rgba(26, 29, 39, .96);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }
  .floating-panel.open { display: block; animation: pop .15s ease both; }
  .reaction-panel {
    padding: 8px;
    max-width: calc(100vw - 24px);
  }
  .reaction-options {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 282px;
  }
  .reaction-option {
    width: 42px; height: 42px; border: 1px solid transparent; border-radius: 10px;
    background: transparent; font-size: 24px; cursor: pointer;
    transition: background .15s, transform .08s;
  }
  .reaction-option:hover { background: rgba(255,255,255,.08); }
  .reaction-option:active { transform: translateY(1px) scale(.96); }

  /* Chat — unified preview + full panel */
  .chat {
    display: flex;
    flex-direction: column;
    border-top: 1px solid var(--border);
    background: var(--card);
    flex-shrink: 0;
    overflow: hidden;
    transition: max-height .3s cubic-bezier(.4,0,.2,1);
    max-height: 72px; /* compact: ~3 messages */
    cursor: pointer;
  }
  .chat.open {
    max-height: max(50vh, 420px);
    min-height: 360px;
    cursor: default;
  }
  .chat-compact {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .chat-compact .cc-msg {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-compact .cc-sender {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }
  .chat-full {
    display: none;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .chat.open .chat-compact { display: none; }
  .chat.open .chat-full { display: flex; }
  .chat-head {
    padding: 12px 16px;
    font-weight: 600; font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .messages {
    flex: 1;
    min-height: 0;  /* CRITICAL: allows flex child to shrink below content size */
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 4px; }

  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.35; word-wrap: break-word; animation: fadein .2s ease; }
  .msg .meta { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: .8; }
  .msg.own { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: #262a36; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
  .msg.file.system { align-self: stretch; max-width: 100%; font-style: normal; }
  .msg.reaction {
    align-self: center;
    max-width: min(280px, 88%);
    padding: 6px 12px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.07);
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    border-radius: 999px;
  }
  .msg.reaction .reaction-emoji {
    color: var(--text);
    font-size: 18px;
    line-height: 1;
    margin-left: 5px;
    vertical-align: -2px;
  }
  /* Peer mic/cam status indicators inside tile-label */
  .tile-label .peer-status {
    display: inline-flex;
    gap: 4px;
    margin-left: 4px;
    font-size: 12px;
    opacity: .92;
  }
  .msg.media { width: min(260px, 80%); padding: 8px; }
  .msg.file { width: min(300px, 86%); padding: 10px; }
  .media-wrap { display: grid; gap: 6px; }
  .media-loading { color: var(--muted); font-size: 12px; }
  .chat-media {
    display: block;
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    object-fit: contain;
    background: rgba(0,0,0,.25);
  }
  .media-fallback {
    color: inherit;
    overflow-wrap: anywhere;
    font-size: 13px;
  }
  .file-card { display: grid; gap: 8px; min-width: 0; }
  .file-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .file-icon {
    width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.11);
    flex: 0 0 auto;
    font-size: 18px;
  }
  .file-info { min-width: 0; flex: 1; }
  .file-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-size, .file-status { color: var(--muted); font-size: 11px; }
  .msg.own .file-size, .msg.own .file-status { color: rgba(255,255,255,.78); }
  .file-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .file-actions .btn { height: 30px; padding: 0 10px; font-size: 12px; }
  .file-progress {
    height: 6px;
    background: rgba(255,255,255,.13);
    border-radius: 999px;
    overflow: hidden;
  }
  .file-progress > span {
    display: block; height: 100%; width: 0%;
    background: currentColor;
    opacity: .9;
    transition: width .15s ease;
  }
  .file-download { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .file-thumb {
    display: block;
    max-width: 100%;
    max-height: 210px;
    border-radius: 8px;
    object-fit: contain;
    background: rgba(0,0,0,.25);
  }
  .file-pending {
    display: none;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,.12);
  }
  .file-pending.open { display: grid; }
  .file-pending .file-actions { justify-content: flex-end; }
  .chat.drag-over .messages {
    outline: 2px dashed var(--accent);
    outline-offset: -8px;
    background: rgba(90,160,255,.08);
  }
  .chat-input {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .chat-input .input { height: 38px; font-size: 14px; }
  .chat-input .btn { height: 38px; }
  .chat-input .btn.icon { width: 38px; padding: 0; font-size: 18px; }
  .sticker-picker {
    position: absolute;
    right: 76px;
    bottom: 56px;
    width: 300px;
    max-width: calc(100vw - 24px);
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 8px;
    background: rgba(26, 29, 39, .98);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    z-index: 3;
  }
  .sticker-picker.open { display: flex; animation: pop .15s ease both; }
  .sticker-picker.below {
    top: 56px;
    bottom: auto;
  }
  .gif-search {
    width: 100%;
    height: 38px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #12151c;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  .gif-search:focus { border-color: rgba(122, 162, 255, .55); }
  .gif-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .gif-state {
    color: var(--muted);
    font-size: 13px;
    padding: 18px 8px;
    text-align: center;
  }
  .gif-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .gif-preview-title {
    max-width: 100%;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gif-preview-image {
    display: block;
    width: min(250px, 100%);
    max-height: 260px;
    object-fit: contain;
    border-radius: 10px;
    background: #12151c;
    cursor: pointer;
  }
  .gif-preview-actions {
    display: flex;
    gap: 8px;
    width: 100%;
  }
  .gif-preview-actions .btn {
    flex: 1;
    height: 36px;
  }
  .sticker-option {
    aspect-ratio: 1;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #12151c;
    cursor: pointer;
    overflow: hidden;
    transition: transform .12s, border-color .15s, background .15s;
  }
  .sticker-option:hover {
    background: #262b39;
    border-color: rgba(255,255,255,.18);
    transform: translateY(-1px);
  }
  .sticker-option img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Toasts */
  #toasts {
    position: fixed; top: 18px; right: 18px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 100;
    pointer-events: none;
  }
  .toast {
    background: var(--card-2); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; max-width: 340px;
    box-shadow: var(--shadow);
    animation: slidein .25s ease;
    pointer-events: auto;
  }
  .toast.error { border-left-color: var(--bad); }
  .toast.warn  { border-left-color: var(--warn); }
  .toast.success { border-left-color: var(--good); }

  /* Animations */
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  /* Mobile */
  @media (max-width: 720px) {
    .topbar { padding: 10px 12px; }
    .grid-wrap { padding: 10px; }
    .grid.n2, .grid.n3, .grid.n4 { grid-template-columns: 1fr; }
    #previewDock {
      right: 12px; bottom: 92px;
      gap: 8px;
      max-width: calc(100vw - 24px);
      overflow: visible;
    }
    .preview-tile {
      width: 170px;
      aspect-ratio: 3/4;
      display: block;
    }
    .toolbar .btn.icon { height: 44px; width: 44px; font-size: 18px; }
    .reaction-options { max-width: 138px; }
    .sticker-picker {
      right: 12px;
      left: 12px;
      width: auto;
      max-width: none;
    }
    .gif-grid {
      grid-template-columns: repeat(2, 1fr);
      max-height: 180px;
    }
    .gif-preview-image {
      width: 100%;
      max-height: 42vh;
    }
    .chat.open {
      max-height: none;
      position: fixed;
      inset: 0;
      z-index: 20;
    }
    .chat.open .chat-full {
      height: 100%;
    }
  }
</style>
</head>
<body>

<!-- ─── Landing page ─────────────────────────────────────── -->
<section id="landing">
  <div class="landing-card">
    <div class="brand"><span class="dot"></span> Vidly</div>
    <h1 class="title">Private video calls,<br/>just a link away.</h1>
    <p class="subtitle">Peer-to-peer, end-to-end. Up to 4 people. No accounts.</p>

    <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted);">Your name</label>
    <input id="usernameInput" class="input" placeholder="Enter your name..." autocomplete="off" maxlength="32"
           style="margin-bottom:18px;" />

    <button id="createBtn" class="btn primary full">＋ Create new room</button>

    <div class="divider">or join with a code</div>

    <div class="row">
      <input id="joinCode" class="input" placeholder="room code" autocomplete="off" />
      <button id="joinBtn" class="btn">Join →</button>
    </div>

    <p class="footer-note">Your camera and audio stream directly to other participants.</p>
  </div>
</section>

<!-- ─── Call page ────────────────────────────────────────── -->
<section id="call">
  <header class="topbar">
    <div class="room-pill">
      <span class="status-dot" id="wsDot"></span>
      Room <code id="roomLabel">—</code>
      <button class="copy-btn" id="copyLink" title="Copy invite link">⧉ copy</button>
    </div>
  </header>

  <div class="stage">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState">
        <div>
          <div class="icon">👥</div>
          <div>Waiting for others to join…</div>
        </div>
      </div>
    </div>
  </div>

  <aside class="chat" id="chat">
    <div class="chat-compact" id="chatCompact">
      <!-- last 2 messages, shown when chat is closed -->
    </div>
    <div class="chat-full" id="chatFull">
      <div class="chat-head">
        <span>Chat</span>
        <button class="btn ghost" id="closeChat">✕</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="file-pending" id="filePending"></div>
      <form class="chat-input" id="chatForm">
        <div class="sticker-picker" id="stickerPicker" aria-label="GIF picker"></div>
        <input id="fileInput" type="file" hidden />
        <button class="btn ghost icon" id="fileBtn" type="button" title="Send file">📎</button>
        <button class="btn ghost icon" id="stickerBtn" type="button" title="GIFs">✨</button>
        <button class="btn ghost icon" id="reactionBtn" type="button" title="Send reaction">😊</button>
        <input class="input" id="chatInput" placeholder="Type a message…" autocomplete="off" />
        <button class="btn primary" type="submit">Send</button>
      </form>
    </div>
  </aside>

  <div id="previewDock">
    <div id="localTile" class="preview-tile">
      <video id="localVideo" autoplay playsinline muted style="display:none;"></video>
      <div id="localPlaceholder">
        <div id="localAvatar">Y</div>
        <button class="cam-on-btn" id="camOnBtn">📷 Turn on camera</button>
      </div>
      <div id="previewBtns">
        <div class="btn-row">
          <button class="switch-cam-btn" id="switchCamBtn" title="Switch camera">🔄</button>
          <button class="confirm-btn" id="confirmCamBtn">✓</button>
          <button class="cancel-btn" id="cancelCamBtn">✕</button>
        </div>
      </div>
      <div class="tile-label" id="localLabel">You</div>
      <div class="resize-handle nw" data-corner="nw"></div>
      <div class="resize-handle ne" data-corner="ne"></div>
      <div class="resize-handle sw" data-corner="sw"></div>
      <div class="resize-handle se" data-corner="se"></div>
    </div>
    <div id="remoteCameraTile" class="preview-tile">
      <video id="remoteCameraVideo" autoplay playsinline muted></video>
      <div class="tile-label" id="remoteCameraLabel">Peer camera</div>
      <div class="resize-handle nw" data-corner="nw"></div>
      <div class="resize-handle ne" data-corner="ne"></div>
      <div class="resize-handle sw" data-corner="sw"></div>
      <div class="resize-handle se" data-corner="se"></div>
    </div>
  </div>

  <footer class="toolbar">
    <button class="btn icon" id="micBtn" title="Mute / unmute mic">🎙️</button>
    <button class="btn icon" id="camBtn" title="Camera on / off">📷</button>
    <button class="btn icon" id="screenBtn" title="Share screen">🖥️</button>
    <button class="btn icon" id="chatBtn" title="Toggle chat">💬</button>
    <button class="btn icon danger" id="leaveBtn" title="Leave call">⛔</button>
  </footer>
  <div class="floating-panel reaction-panel" id="reactionPanel" aria-label="Emoji reactions">
    <div class="reaction-options" id="reactionOptions"></div>
  </div>
</section>

<div id="toasts"></div>

<script>
"use strict";

/* ──────────────────────────────────────────────────────────
   Vidly client — single-file vanilla JS WebRTC mesh client.
   ────────────────────────────────────────────────────────── */

// ─── State ────────────────────────────────────────────────
const peers = new Map(); // peerId -> { pc, dc, polite, makingOffer, ignoreOffer, videoEl, audioEl, tileEl, remoteStream, remoteAudioStream, dot }
let localStream = null;
let cameraStream = null;       // saved when screen sharing
let screenStream = null;
let screenAudioTrack = null;   // optional system/tab audio track from screen share
let screenTrackCheck = null;   // interval for screen track liveness
let isSharing = false;
const ENABLE_SCREEN_AUDIO = true; // Screen audio rides the existing audio sender via replaceTrack().
const MIXER_MIC_GAIN = 1.35;
const MIXER_SCREEN_AUDIO_GAIN = 0.35;
// Audio mixer state — active only during screen share when both mic+screen audio
// must be transmitted on the single negotiated audio sender. Uses Web Audio to
// sum mic and screen-audio into one MediaStreamTrack; no SDP renegotiation needed.
let audioMixer = null; // { ctx, dest, micNode, micGainNode, micSrcStream, screenNode, screenGainNode, screenSrcStream, mixedTrack }
let loadingHistory = false;
let micEnabled = false;
let camEnabled = false;
let micStream = null;        // audio-only stream when mic is on but camera is off
let previewStream = null;    // preview stream during camera confirmation
let activeRemoteVideoPeerId = null;
let activeRemoteVideoTrack = null;
let activeRemoteCameraPeerId = null;
let stallCheckInterval = null;
let myPeerId = null;
let facingMode = 'user';     // 'user' = front camera, 'environment' = back camera
let myUsername = '';
let clientId = '';
let roomId = null;
const CHAT_MAX = 200; // max messages per room in localStorage
let ws = null;
let wsBackoff = 1000;
let wsReconnectTimer = null;
let wsHeartbeatTimer = null;
let lastWsMessageAt = 0;
let intentionalClose = false;
let wakeLock = null;
let iceServers = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:global.stun.twilio.com:3478' },
];

// ─── DOM refs ─────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const landing = $('landing'), call = $('call');
const grid = $('grid'), emptyState = $('emptyState');
const localVideo = $('localVideo'), localTile = $('localTile');
const previewDock = $('previewDock'), remoteCameraTile = $('remoteCameraTile'), remoteCameraVideo = $('remoteCameraVideo');
const remoteCameraLabel = $('remoteCameraLabel');
const localPlaceholder = $('localPlaceholder');
const localAvatar = $('localAvatar');
const previewBtns = $('previewBtns');
const messagesEl = $('messages');
const REACTIONS = ['❤️', '😂', '🎉', '😮', '👏', '🤗'];
const MEDIA_URL_RE = /^https?:\/\/\S+\.(jpe?g|png|gif|webp)(\?\S*)?$/i;
const GIF_SERVICE_RE = /^https?:\/\/\S*(giphy\.com|tenor\.com)\/\S+$/i;
// File transfer tuning. CHUNK_SIZE and BUFFER_HIGH are coupled: effective pipeline
// depth ≈ BUFFER_HIGH / CHUNK_SIZE. Keep that ratio ≥ ~16 to avoid stop-and-wait.
// BUFFER_HIGH must comfortably exceed the bandwidth-delay product of the slowest
// link (TURN WAN ~500KB BDP); 1MB covers that headroom. CHUNK_SIZE must stay
// under the negotiated SCTP maxMessageSize (typically 256KB in Chromium /
// libwebrtc); 64KB is well inside that envelope and minimises iteration overhead.
const FILE_CHUNK_SIZE = 64 * 1024;
const FILE_BUFFER_HIGH = 1 * 1024 * 1024;
const FILE_BUFFER_LOW = 256 * 1024;
const outgoingFiles = new Map(); // fileId -> { file, peers:Set, accepted:Set, completed:Set, rejected:Set, card }
const objectURLs = new Set();   // revoke on beforeunload to prevent memory leaks
const incomingFiles = new Map(); // fileId -> { peer, meta, chunks, received, card, lastProgressSent }

function createClientId() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const bytes = new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6] = (bytes[6] & 0x0f) | 0x40;
    bytes[8] = (bytes[8] & 0x3f) | 0x80;
    const hex = Array.from(bytes, b => b.toString(16).padStart(2, '0'));
    return [
        hex.slice(0, 4).join(''),
        hex.slice(4, 6).join(''),
        hex.slice(6, 8).join(''),
        hex.slice(8, 10).join(''),
        hex.slice(10, 16).join('')
    ].join('-');
}

function getClientId() {
    if (clientId) return clientId;
    clientId = localStorage.getItem('vidly-client-id');
    if (!clientId) {
        clientId = createClientId();
        localStorage.setItem('vidly-client-id', clientId);
    }
    return clientId;
}

// Fresh for each page load, stable across WebSocket reconnects in this page.
// The server uses this to distinguish a network reconnect from a hard refresh
// that needs peers to rebuild their WebRTC connection to this client.
const pageSessionId = createClientId();

// ─── Toast helper ─────────────────────────────────────────
function toast(message, type = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    $('toasts').appendChild(el);
    setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 300);
    }, 3800);
}

// ─── Routing ──────────────────────────────────────────────
function route() {
    const m = location.pathname.match(/^\/room\/([A-Za-z0-9_-]+)$/);
    if (m) {
        roomId = m[1];
        showCall();
    } else {
        showLanding();
    }
}
function showLanding() {
    stopStallMonitor();
    landing.style.display = 'grid';
    call.classList.remove('active');
}
async function showCall() {
    // Ensure we have a username
    if (!myUsername) {
        const saved = localStorage.getItem('vidly-username');
        if (saved) myUsername = saved;
    }
    if (!myUsername) {
        // No username available — redirect to landing
        toast('Please enter your name first', 'warn');
        $('joinCode').value = roomId;
        history.pushState({}, '', '/');
        showLanding();
        return;
    }
    landing.style.display = 'none';
    call.classList.add('active');
    $('roomLabel').textContent = roomId;
    $('localLabel').textContent = myUsername || 'You';
    updateChatCompact();
    loadChatHistory();
    await loadConfig();
    await initLocalMedia();
    connectWebSocket();
    startStallMonitor();
    // Acquire wake lock to prevent screen sleep during call
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
    } catch {}
}

// ─── Landing handlers ─────────────────────────────────────
function randomRoomId(n = 8) {
    const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
    let out = '';
    const arr = new Uint32Array(n);
    crypto.getRandomValues(arr);
    for (let i = 0; i < n; i++) out += alphabet[arr[i] % alphabet.length];
    return out;
}
$('createBtn').onclick = () => {
    const name = $('usernameInput').value.trim();
    if (!name) { toast('Please enter your name', 'warn'); $('usernameInput').focus(); return; }
    myUsername = name;
    localStorage.setItem('vidly-username', name);
    const id = randomRoomId();
    localStorage.setItem('vidly-room', id);
    history.pushState({}, '', '/room/' + id);
    roomId = id;
    showCall();
};
$('joinBtn').onclick = () => {
    const name = $('usernameInput').value.trim();
    if (!name) { toast('Please enter your name', 'warn'); $('usernameInput').focus(); return; }
    myUsername = name;
    localStorage.setItem('vidly-username', name);
    const v = $('joinCode').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if (!v) { toast('Enter a room code', 'warn'); return; }
    localStorage.setItem('vidly-room', v);
    history.pushState({}, '', '/room/' + v);
    roomId = v;
    showCall();
};
$('joinCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
window.addEventListener('popstate', () => location.reload());

// ─── Server config (fetch TURN settings) ──────────────────
async function loadConfig() {
    try {
        const cfg = await (await fetch('/turn-credentials', { cache: 'no-store' })).json();
        if (cfg.urls && cfg.username && cfg.credential) {
            iceServers = iceServers.filter(server => {
                const urls = Array.isArray(server.urls) ? server.urls : [server.urls];
                return !urls.some(url => typeof url === 'string' && url.startsWith('turn:'));
            });
            iceServers.push({
                urls: cfg.urls,
                username: cfg.username,
                credential: cfg.credential
            });
        }
    } catch (e) {
        console.warn('Failed to fetch /turn-credentials', e);
    }
}

// ─── Local media ──────────────────────────────────────────
async function initLocalMedia() {
    // Camera and mic OFF by default — no permission prompt on load.
    localStream = new MediaStream();
    cameraStream = localStream;
    camEnabled = false;
    micEnabled = false;
    $('micBtn').classList.add('muted');
    $('micBtn').textContent = '🔇';
    $('camBtn').classList.add('muted');
    $('camBtn').textContent = '📵';
    hideLocalVideoTile();
}

function showLocalPlaceholder() {
    localVideo.style.display = 'none';
    localPlaceholder.classList.remove('hidden');
    // Update avatar letter
    const letter = (myUsername || 'Y').charAt(0).toUpperCase();
    localAvatar.textContent = letter;
}

function hideLocalPlaceholder() {
    localPlaceholder.classList.add('hidden');
    localVideo.style.display = '';
}

function clearLocalVideoElement() {
    try { localVideo.pause(); } catch {}
    localVideo.srcObject = null;
    localVideo.removeAttribute('src');
    localVideo.removeAttribute('poster');
    try { localVideo.load(); } catch {}
    localVideo.style.display = 'none';
}

function updatePreviewDockVisibility() {
    const localVisible = localTile.style.display !== 'none';
    const cameraVisible = remoteCameraTile.style.display !== 'none' && !!remoteCameraVideo.srcObject;
    previewDock.style.display = localVisible || cameraVisible ? 'flex' : 'none';
}

function syncRemoteCameraTileToLocal() {
    const rect = localTile.getBoundingClientRect();
    if (rect.width > 0) remoteCameraTile.style.width = rect.width + 'px';
    if (rect.height > 0) remoteCameraTile.style.height = rect.height + 'px';
    remoteCameraTile.style.aspectRatio = localTile.style.aspectRatio;
}

function hideLocalVideoTile() {
    clearLocalVideoElement();
    showLocalPlaceholder();
    localTile.style.display = 'none';
    localTile.classList.remove('screensharing');
    updatePreviewDockVisibility();
}

function clearActiveRemoteVideo(peerId, track, videoEl, tileEl, remoteStream) {
    if (track && activeRemoteVideoTrack && activeRemoteVideoTrack !== track) return;
    if (peerId && activeRemoteVideoPeerId && activeRemoteVideoPeerId !== peerId) return;
    if (track && remoteStream) {
        try { remoteStream.removeTrack(track); } catch {}
    } else if (remoteStream) {
        for (const videoTrack of remoteStream.getVideoTracks()) {
            try { remoteStream.removeTrack(videoTrack); } catch {}
        }
    }
    activeRemoteVideoTrack = null;
    activeRemoteVideoPeerId = null;
    if (videoEl) {
        try { videoEl.pause(); } catch {}
        videoEl.srcObject = null;
        videoEl.removeAttribute('src');
        videoEl.removeAttribute('poster');
        delete videoEl.dataset.stalled;
        try { videoEl.load(); } catch {}
    }
    if (tileEl) {
        hideStallOverlay(tileEl);
        tileEl.classList.add('placeholder');
    }
    if (peerId) {
        const peer = peers.get(peerId);
        if (peer) {
            peer.lastVideoFrameTime = null;
            peer.videoTrackStartedAt = null;
            peer.videoFrameTrack = null;
            if (!track || peer.remoteScreenTrack === track) peer.remoteScreenTrack = null;
        }
    }
}

function clearRemoteCameraVideo(peer, track = null) {
    if (!peer) return;
    if (track && peer.remoteCameraTrack && peer.remoteCameraTrack !== track) return;
    if (peer.remoteCameraStream) {
        for (const videoTrack of peer.remoteCameraStream.getVideoTracks()) {
            try { peer.remoteCameraStream.removeTrack(videoTrack); } catch {}
        }
    }
    if (!track || peer.remoteCameraTrack === track) peer.remoteCameraTrack = null;
    if (activeRemoteCameraPeerId === peer.id) {
        activeRemoteCameraPeerId = null;
        try { remoteCameraVideo.pause(); } catch {}
        remoteCameraVideo.srcObject = null;
        remoteCameraVideo.removeAttribute('src');
        remoteCameraVideo.removeAttribute('poster');
        try { remoteCameraVideo.load(); } catch {}
        remoteCameraTile.style.display = 'none';
        updatePreviewDockVisibility();
    }
}

function clearAllRemoteVideo(peer) {
    if (!peer) return;
    clearActiveRemoteVideo(peer.id, null, peer.videoEl, peer.tileEl, peer.remoteStream);
    clearRemoteCameraVideo(peer);
}

function classifyRemoteVideoTrack(peer, track) {
    if (peer.remoteCameraTrack === track) return 'camera';
    if (peer.remoteScreenTrack === track) return 'screen';
    if (peer.mediaState?.screen && (!peer.mediaState.cam || peer.remoteCameraTrack)) return 'screen';
    return peer.remoteCameraTrack ? 'screen' : 'camera';
}

function selectRemoteVideoTrack(peer) {
    return peer.remoteScreenTrack || null;
}

function renderRemoteCameraTrack(peer) {
    const track = peer.remoteCameraTrack;
    if (!track) {
        clearRemoteCameraVideo(peer);
        return;
    }
    if (activeRemoteCameraPeerId && activeRemoteCameraPeerId !== peer.id) {
        const previousPeer = peers.get(activeRemoteCameraPeerId);
        if (previousPeer) clearRemoteCameraVideo(previousPeer);
    }
    if (!peer.remoteCameraStream) peer.remoteCameraStream = new MediaStream();
    for (const oldTrack of peer.remoteCameraStream.getVideoTracks()) {
        if (oldTrack !== track) {
            try { peer.remoteCameraStream.removeTrack(oldTrack); } catch {}
        }
    }
    if (!peer.remoteCameraStream.getTracks().includes(track)) {
        peer.remoteCameraStream.addTrack(track);
    }
    activeRemoteCameraPeerId = peer.id;
    remoteCameraVideo.srcObject = peer.remoteCameraStream;
    syncRemoteCameraTileToLocal();
    remoteCameraTile.style.display = 'block';
    remoteCameraLabel.textContent = (peer.username || 'Peer') + ' camera';
    updatePreviewDockVisibility();
    remoteCameraVideo.play().catch(() => {});
}

function renderRemoteVideoTrack(peer) {
    const track = selectRemoteVideoTrack(peer);
    if (!track) {
        clearActiveRemoteVideo(peer.id, null, peer.videoEl, peer.tileEl, peer.remoteStream);
        return;
    }
    for (const oldTrack of peer.remoteStream.getVideoTracks()) {
        if (oldTrack !== track) {
            try { peer.remoteStream.removeTrack(oldTrack); } catch {}
        }
    }
    if (!peer.remoteStream.getTracks().includes(track)) {
        peer.remoteStream.addTrack(track);
    }
    activeRemoteVideoPeerId = peer.id;
    activeRemoteVideoTrack = track;
    startRemoteFrameTracking(peer, track);
    peer.videoEl.srcObject = peer.remoteStream;
    peer.videoEl.style.display = '';
    peer.tileEl.classList.remove('placeholder');
    markVideoStalled(peer, false);
    peer.videoEl.play().catch(() => {});
}

function removeRemoteVideoTrack(peer, track) {
    if (peer.remoteCameraTrack === track) peer.remoteCameraTrack = null;
    if (peer.remoteScreenTrack === track) peer.remoteScreenTrack = null;
    try { peer.remoteStream.removeTrack(track); } catch {}
    if (peer.remoteCameraStream) try { peer.remoteCameraStream.removeTrack(track); } catch {}
    if (activeRemoteVideoTrack === track) {
        activeRemoteVideoTrack = null;
        activeRemoteVideoPeerId = null;
        renderRemoteVideoTrack(peer);
    }
    if (activeRemoteCameraPeerId === peer.id && !peer.remoteCameraTrack) clearRemoteCameraVideo(peer, track);
}

function showStallOverlay(tileEl) {
    if (!tileEl || tileEl.querySelector('.stall-overlay')) return;
    const overlay = document.createElement('div');
    overlay.className = 'stall-overlay';
    tileEl.appendChild(overlay);
}

function hideStallOverlay(tileEl) {
    const overlay = tileEl?.querySelector('.stall-overlay');
    if (overlay) overlay.remove();
}

function isPeerMediaVideoOn(peer) {
    return !peer.mediaState || peer.mediaState.video !== false;
}

function isPeerConnectionAlive(peer) {
    return peer.pc.connectionState === 'connected' ||
        peer.pc.iceConnectionState === 'connected' ||
        peer.pc.iceConnectionState === 'completed';
}

function markVideoStalled(peer, stalled) {
    if (!peer?.videoEl || !peer.tileEl) return;
    if (stalled) {
        if (peer.videoEl.dataset.stalled !== 'true') {
            const name = peer.username || 'Peer';
            toast(`${name}'s video feed seems to have cut out`, 'warn');
        }
        peer.videoEl.dataset.stalled = 'true';
        peer.tileEl.classList.remove('placeholder');
        showStallOverlay(peer.tileEl);
    } else {
        delete peer.videoEl.dataset.stalled;
        hideStallOverlay(peer.tileEl);
    }
}

function noteRemoteVideoFrame(peer, track) {
    if (activeRemoteVideoPeerId !== peer.id || activeRemoteVideoTrack !== track) return;
    peer.lastVideoFrameTime = Date.now();
    markVideoStalled(peer, false);
}

function startRemoteFrameTracking(peer, track) {
    if (peer.videoFrameTrack === track && peer.videoTrackStartedAt) return;
    peer.videoFrameTrack = track;
    peer.videoTrackStartedAt = Date.now();
    peer.lastVideoFrameTime = null;
    if (typeof peer.videoEl.requestVideoFrameCallback !== 'function') return;
    const pump = () => {
        peer.videoEl.requestVideoFrameCallback(() => {
            if (!peers.has(peer.id) || peer.videoFrameTrack !== track || track.readyState === 'ended') return;
            noteRemoteVideoFrame(peer, track);
            pump();
        });
    };
    pump();
}

function startStallMonitor() {
    if (stallCheckInterval) return;
    stallCheckInterval = setInterval(() => {
        const now = Date.now();
        for (const peer of peers.values()) {
            if (activeRemoteVideoPeerId !== peer.id || !activeRemoteVideoTrack) {
                markVideoStalled(peer, false);
                continue;
            }
            if (!isPeerMediaVideoOn(peer) || activeRemoteVideoTrack.readyState === 'ended' || !isPeerConnectionAlive(peer)) {
                markVideoStalled(peer, false);
                continue;
            }
            const lastFrameAt = peer.lastVideoFrameTime || peer.videoTrackStartedAt;
            markVideoStalled(peer, !!lastFrameAt && now - lastFrameAt > 5000);
        }
    }, 3000);
}

function stopStallMonitor() {
    if (stallCheckInterval) clearInterval(stallCheckInterval);
    stallCheckInterval = null;
    document.querySelectorAll('.stall-overlay').forEach(el => el.remove());
    document.querySelectorAll('video[data-stalled]').forEach(el => delete el.dataset.stalled);
}

async function previewCamera() {
    try {
        // Release audio device first if micStream exists (to avoid AbortError)
        if (micStream) {
            // Drop the soon-to-be-stopped track from the mixer so it doesn't
            // hold a dead MediaStreamAudioSourceNode during the preview.
            if (audioMixer) setMixerMicTrack(null);
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        previewStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: facingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30 }
            },
            audio: { echoCancellation: true, noiseSuppression: true }
        });
        // Show preview in local video
        localVideo.srcObject = previewStream;
        localTile.style.display = '';
        updatePreviewDockVisibility();
        localVideo.style.display = '';
        localPlaceholder.classList.add('hidden');
        previewBtns.classList.add('active');
    } catch (err) {
        console.error('[WebRTC] preview getUserMedia failed', err);
        let m = err.message || String(err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            m = 'Camera blocked: please allow camera/mic access in browser settings.';
        } else if (err.name === 'NotFoundError') {
            m = 'No camera or microphone found on this device.';
        } else if (err.name === 'NotReadableError') {
            m = 'Camera is in use by another application.';
        }
        toast(m, 'error');
    }
}

function confirmCamera() {
    previewBtns.classList.remove('active');
    if (!previewStream) return;

    // Promote preview to live
    cameraStream = previewStream;
    localStream = previewStream;
    previewStream = null;
    camEnabled = true;
    micEnabled = true;

    // Update button states
    $('camBtn').classList.remove('muted');
    $('camBtn').textContent = '📷';
    $('micBtn').classList.remove('muted');
    $('micBtn').textContent = '🎙️';

    localTile.style.display = '';
    updatePreviewDockVisibility();

    // Replace tracks on existing senders (no renegotiation needed)
    const newVideoTrack = localStream.getVideoTracks()[0];
    const newAudioTrack = localStream.getAudioTracks()[0];
    // If screen share is active, audio sender carries the mixed track — feed
    // the new camera-mic into the mixer instead of touching the sender.
    if (audioMixer && newAudioTrack) {
        setMixerMicTrack(newAudioTrack);
    }
    for (const peer of peers.values()) {
        const audioSender = findSenderByKind(peer.pc, 'audio');

        if (peer.cameraSender && newVideoTrack) {
            try { peer.cameraSender.replaceTrack(newVideoTrack); } catch {}
        } else if (!peer.cameraSender && newVideoTrack) {
            try { peer.cameraSender = peer.pc.addTrack(newVideoTrack, localStream); } catch {}
        }
        if (!audioMixer) {
            if (audioSender && newAudioTrack) {
                try { audioSender.replaceTrack(newAudioTrack); } catch {}
            } else if (!audioSender && newAudioTrack) {
                try { peer.pc.addTrack(newAudioTrack, localStream); } catch {}
            }
        }
    }

    toast('Camera and mic are now on', 'success');
    broadcastLocalMediaState();
}

async function cancelCamera() {
    previewBtns.classList.remove('active');
    if (previewStream) {
        previewStream.getTracks().forEach(t => t.stop());
        previewStream = null;
    }
    hideLocalVideoTile();

    // previewCamera() stopped the audio-only micStream to free the mic device.
    // If the mic was on before previewing, re-acquire it so peers keep hearing us.
    if (micEnabled && !micStream) {
        try {
            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true }
            });
            const audioTrack = micStream.getAudioTracks()[0];
            if (audioMixer) {
                // Mixer owns the sender's track during screen share — feed mic
                // back into the mix instead of replacing the sender.
                setMixerMicTrack(audioTrack);
            } else {
                for (const peer of peers.values()) {
                    const sender = findSenderByKind(peer.pc, 'audio');
                    if (sender) {
                        try { sender.replaceTrack(audioTrack); } catch {}
                    } else if (audioTrack) {
                        try { peer.pc.addTrack(audioTrack, micStream); } catch {}
                    }
                }
            }
        } catch (err) {
            console.error('[WebRTC] failed to restore mic after cancel', err);
            micEnabled = false;
            $('micBtn').classList.add('muted');
            $('micBtn').textContent = '🔇';
            toast('Microphone was released and could not be restored', 'warn');
        }
    }
    broadcastLocalMediaState();
}
// ─── Camera switch (front/back) ───────────────────────────
$('switchCamBtn').onclick = async () => {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    // If preview is active, restart it with the new facing mode
    if (previewStream) {
        previewStream.getTracks().forEach(t => t.stop());
        previewStream = null;
    }
    await previewCamera();
};

// ─── Draggable preview dock ────────────────────────────────
(function initDraggable() {
    let isDragging = false;
    let startX, startY, startRight, startBottom;
    let hasMoved = false;
    const rect0 = localTile.getBoundingClientRect();
    const computedAspect = getComputedStyle(localTile).aspectRatio;
    const aspectParts = computedAspect.split('/').map(v => parseFloat(v.trim()));
    const tileAspect = rect0.width && rect0.height
        ? rect0.width / rect0.height
        : (aspectParts.length === 2 && aspectParts.every(Number.isFinite) && aspectParts[1]
            ? aspectParts[0] / aspectParts[1]
            : 16 / 9);

    function getViewportBounds() {
        return {
            w: window.innerWidth,
            h: window.innerHeight
        };
    }

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    function onPointerDown(e) {
        // Only start drag from the tile itself, not from buttons inside it
        if (e.target.closest('.resize-handle')) return;
        if (e.target.closest('button') || e.target.closest('.btn')) return;
        isDragging = true;
        hasMoved = false;
        const pos = e.touches ? e.touches[0] : e;
        startX = pos.clientX;
        startY = pos.clientY;
        const rect = previewDock.getBoundingClientRect();
        const vp = getViewportBounds();
        startRight = vp.w - rect.right;
        startBottom = vp.h - rect.bottom;
        previewDock.classList.add('dragging');
        if (e.type === 'touchstart') e.preventDefault();
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        const pos = e.touches ? e.touches[0] : e;
        const dx = pos.clientX - startX;
        const dy = pos.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
        const vp = getViewportBounds();
        const rect = previewDock.getBoundingClientRect();
        const dockW = rect.width || 200;
        const dockH = rect.height || 112;
        const newRight = clamp(startRight - dx, 0, Math.max(0, vp.w - dockW));
        const newBottom = clamp(startBottom - dy, 0, Math.max(0, vp.h - dockH));
        previewDock.style.right = newRight + 'px';
        previewDock.style.bottom = newBottom + 'px';
        previewDock.style.left = 'auto';
        previewDock.style.top = 'auto';
        if (e.type === 'touchmove') e.preventDefault();
    }

    function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        previewDock.classList.remove('dragging');
        // Save position to sessionStorage
        if (hasMoved) {
            sessionStorage.setItem('vidly-pip-right', previewDock.style.right);
            sessionStorage.setItem('vidly-pip-bottom', previewDock.style.bottom);
        }
        // Ensure tile is visible after drag — snap back if off-screen
        const vp = getViewportBounds();
        const rect = previewDock.getBoundingClientRect();
        if (rect.left < 0 || rect.top < 0 || rect.right > vp.w || rect.bottom > vp.h) {
            previewDock.style.right = '22px';
            previewDock.style.bottom = '110px';
            previewDock.style.left = 'auto';
            previewDock.style.top = 'auto';
            sessionStorage.removeItem('vidly-pip-right');
            sessionStorage.removeItem('vidly-pip-bottom');
        }
    }

    // ─── Resize handles ──────────────────────────────
    const MIN_W = 120, MAX_W = 600;
    const handles = previewDock.querySelectorAll('.resize-handle');
    let isResizing = false;
    let resizeCorner = '';
    let resizeStartX, resizeStartY, resizeStartW, resizeStartH, resizeStartRight;

    function onResizeDown(e) {
        e.stopPropagation(); // don't trigger drag
        isResizing = true;
        resizeCorner = e.target.dataset.corner;
        const pos = e.touches ? e.touches[0] : e;
        resizeStartX = pos.clientX;
        resizeStartY = pos.clientY;
        const rect = localTile.getBoundingClientRect();
        resizeStartW = rect.width;
        resizeStartH = rect.height;
        resizeStartRight = getViewportBounds().w - rect.right;
        localTile.style.aspectRatio = '';
        remoteCameraTile.style.aspectRatio = '';
        if (e.type === 'touchstart') e.preventDefault();
    }

    function onResizeMove(e) {
        if (!isResizing) return;
        const pos = e.touches ? e.touches[0] : e;
        const dx = pos.clientX - resizeStartX;
        const dy = pos.clientY - resizeStartY;

        let newW;
        if (resizeCorner === 'se' || resizeCorner === 'ne') {
            newW = resizeStartW + dx;
        } else {
            newW = resizeStartW - dx;
        }
        newW = Math.max(MIN_W, Math.min(MAX_W, newW));
        const newH = newW / tileAspect;

        localTile.style.width = newW + 'px';
        localTile.style.height = newH + 'px';
        remoteCameraTile.style.width = newW + 'px';
        remoteCameraTile.style.height = newH + 'px';

        // Reposition if resizing from left corners (nw/sw)
        if (resizeCorner === 'nw' || resizeCorner === 'sw') {
            previewDock.style.right = (resizeStartRight + (resizeStartW - newW)) + 'px';
        }

        if (e.type === 'touchmove') e.preventDefault();
    }

    function onResizeUp() {
        if (!isResizing) return;
        isResizing = false;
        // Save size
        sessionStorage.setItem('vidly-pip-w', localTile.style.width);
        sessionStorage.setItem('vidly-pip-h', localTile.style.height);
    }

    // Mouse events
    localTile.addEventListener('mousedown', onPointerDown);
    remoteCameraTile.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);

    // Touch events
    localTile.addEventListener('touchstart', onPointerDown, { passive: false });
    remoteCameraTile.addEventListener('touchstart', onPointerDown, { passive: false });
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerUp);

    handles.forEach(h => {
        h.addEventListener('mousedown', onResizeDown);
        h.addEventListener('touchstart', onResizeDown, { passive: false });
    });
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('touchmove', onResizeMove, { passive: false });
    document.addEventListener('mouseup', onResizeUp);
    document.addEventListener('touchend', onResizeUp);

    // Restore saved position
    const savedRight = sessionStorage.getItem('vidly-pip-right');
    const savedBottom = sessionStorage.getItem('vidly-pip-bottom');
    if (savedRight && savedBottom) {
        previewDock.style.right = savedRight;
        previewDock.style.bottom = savedBottom;
    }

    // Restore saved size
    const savedW = sessionStorage.getItem('vidly-pip-w');
    const savedH = sessionStorage.getItem('vidly-pip-h');
    if (savedW && savedH) {
        localTile.style.width = savedW;
        localTile.style.height = savedH;
        localTile.style.aspectRatio = '';
        remoteCameraTile.style.width = savedW;
        remoteCameraTile.style.height = savedH;
        remoteCameraTile.style.aspectRatio = '';
    }
})();

// ─── WebSocket signaling ──────────────────────────────────
function connectWebSocket() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    setWsDot('connecting');

    ws.onopen = () => {
        wsBackoff = 1000;
        lastWsMessageAt = Date.now();
        setWsDot('connected');
        startWsHeartbeat();
    };

    ws.onmessage = (e) => {
        lastWsMessageAt = Date.now();
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }
        handleSignaling(msg);
    };

    ws.onclose = () => {
        setWsDot('failed');
        stopWsHeartbeat();
        if (intentionalClose) return;
        if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(() => {
            wsBackoff = Math.min(wsBackoff * 2, 10000);
            ws = null;
            connectWebSocket();
        }, wsBackoff);
    };

    ws.onerror = () => { /* close handler will retry */ };
}

function startWsHeartbeat() {
    stopWsHeartbeat();
    wsHeartbeatTimer = setInterval(() => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        sendWs({ type: 'ping', ts: Date.now() });
    }, 20000);
}

function stopWsHeartbeat() {
    if (!wsHeartbeatTimer) return;
    clearInterval(wsHeartbeatTimer);
    wsHeartbeatTimer = null;
}

function checkWebSocketHealth() {
    if (!roomId || intentionalClose) return;
    if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
        ws = null;
        connectWebSocket();
        return;
    }
    if (ws.readyState === WebSocket.OPEN && Date.now() - lastWsMessageAt > 45000) {
        sendWs({ type: 'ping', ts: Date.now(), check: true });
    }
}

function setWsDot(state) {
    const dot = $('wsDot');
    dot.className = 'status-dot ' + state;
}

function sendWs(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
    }
}

function handleSignaling(msg) {
    switch (msg.type) {
        case 'pong':
            lastWsMessageAt = Date.now();
            break;

        case 'welcome':
            myPeerId = msg.peerId;
            sendWs({ type: 'set-username', username: myUsername });
            sendWs({ type: 'join', roomId, username: myUsername, clientId: getClientId(), pageSessionId });
            break;

        case 'joined':
            if (!msg.resumed && peers.size > 0) {
                for (const [id] of peers) removePeer(id);
            }
            if (msg.peerId) myPeerId = msg.peerId;
            // We are the joining peer — we initiate offers to existing peers.
            // Joining peer is "impolite" to avoid glare with simultaneous offers.
            // Reconcile: remove any stale peers not in server's list.
            const liveIds = new Set(msg.peers.map(p => p.peerId));
            for (const [id] of peers) {
                if (!liveIds.has(id)) removePeer(id);
            }
            for (const p of msg.peers) {
                const peer = ensurePeer(p.peerId, /*polite*/ false, /*createDC*/ true, p.username);
                negotiatePeer(peer, 'joined existing peer');
            }
            updateEmptyState();
            break;

        case 'peer-joined':
            // We're an existing peer — wait for the joiner's offer.
            // Existing peer is "polite".
            // Deduplicate: if a peer with the same username exists (stale entry from missed peer-left), remove it.
            if (msg.username) {
                for (const [id, p] of peers) {
                    if (p.username === msg.username && id !== msg.peerId) {
                        removePeer(id);
                    }
                }
            }
            ensurePeer(msg.peerId, /*polite*/ true, /*createDC*/ false, msg.username);
            toast((msg.username || 'Someone') + ' joined the call', 'success');
            updateEmptyState();
            break;

        case 'peer-resumed':
            // Same page-session reconnect: keep the existing WebRTC/DataChannel
            // alive. Hard refreshes are announced as peer-left + peer-joined so
            // both sides rebuild stale peer connections only when needed.
            if (peers.has(msg.peerId)) {
                const peer = peers.get(msg.peerId);
                if (msg.username) peer.username = msg.username;
            } else {
                ensurePeer(msg.peerId, /*polite*/ true, /*createDC*/ false, msg.username);
            }
            updateEmptyState();
            break;

        case 'peer-left':
            removePeer(msg.peerId);
            toast((msg.username || 'A participant') + ' left', '');
            updateEmptyState();
            break;

        case 'signal':
            onPeerSignal(msg.from, msg.payload);
            break;

        case 'room-full':
            toast('Room is full (max 4 people)', 'error');
            setTimeout(() => { intentionalClose = true; ws && ws.close(); leaveCall(); }, 2000);
            break;

        case 'username-taken':
            toast('Name "' + msg.username + '" is already taken in this room', 'error');
            setTimeout(() => { intentionalClose = true; ws && ws.close(); leaveCall(); }, 2000);
            break;
    }
}

// ─── Peer management ──────────────────────────────────────
function ensurePeer(peerId, polite, createDC, username) {
    let peer = peers.get(peerId);
    if (peer) return peer;

    const pc = new RTCPeerConnection({ iceServers });
    const remoteStream = new MediaStream();
    const remoteAudioStream = new MediaStream();
    const { tileEl, videoEl, audioEl, dot } = createTile(peerId, username);
    videoEl.srcObject = remoteStream;
    audioEl.srcObject = remoteAudioStream;

    peer = {
        id: peerId,
        pc, dc: null, fileDc: null, polite,
        makingOffer: false, ignoreOffer: false,
        cameraSender: null, screenSender: null,
        iceRestartTimer: null,
        videoEl, audioEl, tileEl, remoteStream, remoteAudioStream, remoteCameraStream: null, dot,
        username: username || null,
        lastVideoFrameTime: null,
        videoTrackStartedAt: null,
        videoFrameTrack: null,
        remoteCameraTrack: null,
        remoteScreenTrack: null,
        mediaState: null
    };
    peers.set(peerId, peer);

    videoEl.addEventListener('timeupdate', () => {
        if (peer.videoFrameTrack && typeof videoEl.requestVideoFrameCallback !== 'function') {
            noteRemoteVideoFrame(peer, peer.videoFrameTrack);
        }
    });

    // Add our local tracks to the connection.
    const activeCameraTrack = getActiveCameraTrack();
    if (activeCameraTrack) {
        peer.cameraSender = pc.addTrack(activeCameraTrack, localStream || cameraStream || new MediaStream([activeCameraTrack]));
    }
    if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) pc.addTrack(audioTrack, localStream);
    }
    // Also add mic-only stream if camera is off but mic is on.
    if (micStream) {
        for (const track of micStream.getTracks()) {
            pc.addTrack(track, micStream);
        }
    }
    if (isSharing && screenStream) {
        const screenTrack = screenStream.getVideoTracks()[0];
        if (screenTrack && screenTrack.readyState !== 'ended') {
            try { peer.screenSender = pc.addTrack(screenTrack, screenStream); } catch (e) { console.warn(e); }
        }
    }
    // Keep an audio sender available even when mic/camera are off. Screen audio
    // can later use replaceTrack() without adding a transceiver mid-call.
    if (!findSenderByKind(pc, 'audio') && typeof pc.addTransceiver === 'function') {
        try { pc.addTransceiver('audio', { direction: 'sendrecv' }); } catch {}
    }
    // Late join during screen share: route the mixed mic+screen audio onto this
    // peer's audio sender so they hear both, just like everyone else.
    if (audioMixer && audioMixer.mixedTrack) {
        const audioSender = findSenderByKind(pc, 'audio');
        if (audioSender) {
            try { audioSender.replaceTrack(audioMixer.mixedTrack); } catch (e) { console.warn(e); }
        }
    }

    // ICE candidates → ship to peer via signaling server.
    pc.onicecandidate = (e) => {
        if (e.candidate) sendSignal(peerId, { candidate: e.candidate });
    };

    // Remote tracks → attach video to the visible <video> and audio to a
    // dedicated hidden <audio>. Keeping audio separate prevents video cleanup
    // from pausing or detaching the audio playback pipeline.
    pc.ontrack = (e) => {
        console.log('[WebRTC] ontrack:', e.track.kind, e.track.id, 'readyState:', e.track.readyState);
        const track = e.track;

        if (track.kind === 'video') {
            if (activeRemoteVideoPeerId && activeRemoteVideoPeerId !== peerId) {
                console.log('[WebRTC] ignoring additional remote video from', peerId);
                return;
            }
            const role = classifyRemoteVideoTrack(peer, track);
            if (role === 'screen') peer.remoteScreenTrack = track;
            else peer.remoteCameraTrack = track;
            if (role === 'screen') renderRemoteVideoTrack(peer);
            else renderRemoteCameraTrack(peer);
        } else {
            if (!peer.remoteAudioStream.getTracks().includes(track)) {
                peer.remoteAudioStream.addTrack(track);
            }
            audioEl.srcObject = peer.remoteAudioStream;
            audioEl.play().catch(() => {});
        }

        if (track.kind === 'video') {
            // Track mute can mean either intentional camera-off or a bandwidth stall.
            // The explicit media-state video:false message handles true camera-off.
            track.onmute = () => {
                console.log('[WebRTC] video track muted');
                if (!isPeerMediaVideoOn(peer)) {
                    clearAllRemoteVideo(peer);
                    return;
                }
                if (peer.remoteCameraTrack === track && peer.mediaState?.cam === false) {
                    clearRemoteCameraVideo(peer, track);
                    return;
                }
                if (peer.remoteScreenTrack === track && peer.mediaState?.screen === false) {
                    clearActiveRemoteVideo(peerId, track, videoEl, tileEl, remoteStream);
                    return;
                }
                peer.lastVideoFrameTime = null;
                if (activeRemoteVideoTrack === track) markVideoStalled(peer, true);
            };
            track.onunmute = () => {
                console.log('[WebRTC] video track un-muted');
                if (activeRemoteVideoPeerId && activeRemoteVideoPeerId !== peerId) return;
                if (peer.remoteScreenTrack === track) renderRemoteVideoTrack(peer);
                else if (peer.remoteCameraTrack === track) renderRemoteCameraTrack(peer);
            };

            if (track.muted) {
                console.log('[WebRTC] video track arrived already muted');
                if (!isPeerMediaVideoOn(peer)) clearAllRemoteVideo(peer);
                else if (activeRemoteVideoTrack === track) markVideoStalled(peer, true);
            }
        }

        track.onended = () => {
            console.log('[WebRTC] track ended:', track.kind);
            if (track.kind === 'video') {
                try { remoteStream.removeTrack(track); } catch {}
                removeRemoteVideoTrack(peer, track);
            } else {
                try { peer.remoteAudioStream.removeTrack(track); } catch {}
            }
        };
    };

    // Update connection-status dot in the tile label.
    pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === 'connected') {
            dot.className = 'status-dot connected';
        } else if (s === 'connecting' || s === 'new') {
            dot.className = 'status-dot connecting';
        } else if (s === 'failed' || s === 'disconnected' || s === 'closed') {
            dot.className = 'status-dot failed';
            if (s === 'failed') toast('Connection to a peer failed', 'error');
        }
    };

    // ICE failure → restart immediately. ICE disconnection is common on mobile
    // network changes, so only restart if it persists long enough to matter.
    pc.oniceconnectionstatechange = async () => {
        const state = pc.iceConnectionState;
        if (state === 'failed') {
            restartPeerIce(peer, 'failed');
        } else if (state === 'disconnected') {
            schedulePeerIceRestart(peer);
        } else if (state === 'connected' || state === 'completed' || state === 'closed') {
            cancelPeerIceRestart(peer);
        }
    };

    /*
     * Perfect-negotiation: only one side initiates SDP, the other reacts.
     * The joining peer is "impolite" (polite=false) and creates the offer.
     * onnegotiationneeded fires automatically when addTrack (above) modifies
     * the transceiver set.
     */
    pc.onnegotiationneeded = async () => {
        negotiatePeer(peer, 'negotiationneeded');
    };

    // DataChannel — created by the offerer (joining peer), received by answerer.
    if (createDC) {
        const dc = pc.createDataChannel('chat');
        attachDataChannel(peer, dc);
        const fileDc = pc.createDataChannel('file');
        attachFileDataChannel(peer, fileDc);
    }
    pc.ondatachannel = (e) => {
        if (e.channel.label === 'file') attachFileDataChannel(peer, e.channel);
        else attachDataChannel(peer, e.channel);
    };

    return peer;
}

async function onPeerSignal(fromId, payload) {
    // If we don't yet know this peer (e.g., they joined and offered before we
    // got the peer-joined message), create as polite=true since we're existing.
    let peer = peers.get(fromId);
    if (!peer) peer = ensurePeer(fromId, /*polite*/ true, /*createDC*/ false);
    const { pc } = peer;

    try {
        if (payload.description) {
            const desc = payload.description;
            const offerCollision = desc.type === 'offer' &&
                (peer.makingOffer || pc.signalingState !== 'stable');
            peer.ignoreOffer = !peer.polite && offerCollision;
            if (peer.ignoreOffer) return;

            await pc.setRemoteDescription(desc);
            if (desc.type === 'offer') {
                await pc.setLocalDescription();
                sendSignal(fromId, { description: pc.localDescription });
            }
        } else if (payload.candidate) {
            try {
                await pc.addIceCandidate(payload.candidate);
            } catch (err) {
                if (!peer.ignoreOffer) console.warn('addIceCandidate failed', err);
            }
        }
    } catch (err) {
        console.error('onPeerSignal error', err);
    }
}

function sendSignal(to, payload) {
    sendWs({ type: 'signal', to, payload });
}

async function negotiatePeer(peer, reason) {
    if (!peer || peer.makingOffer || peer.pc.signalingState !== 'stable') return;
    try {
        peer.makingOffer = true;
        await peer.pc.setLocalDescription();
        sendSignal(peer.id, { description: peer.pc.localDescription });
    } catch (err) {
        console.error('negotiation failed:', reason, err);
    } finally {
        peer.makingOffer = false;
    }
}

function findSenderByKind(pc, kind) {
    const sender = pc.getSenders().find(s => s.track?.kind === kind);
    if (sender) return sender;
    if (typeof pc.getTransceivers === 'function') {
        const transceiver = pc.getTransceivers().find(t =>
            t.sender &&
            t.receiver?.track?.kind === kind &&
            (t.direction === 'sendrecv' || t.direction === 'sendonly' ||
             t.currentDirection === 'sendrecv' || t.currentDirection === 'sendonly')
        );
        if (transceiver?.sender) return transceiver.sender;
    }
    return null;
}

function getActiveAudioTrack() {
    if (!micEnabled) return null;
    const micTrack = micStream && micStream.getAudioTracks()[0];
    if (micTrack && micTrack.readyState !== 'ended') return micTrack;
    const localAudioTrack = localStream && localStream.getAudioTracks()[0];
    if (localAudioTrack && localAudioTrack.readyState !== 'ended') return localAudioTrack;
    return null;
}

function getActiveCameraTrack() {
    if (!camEnabled) return null;
    const cameraTrack = cameraStream && cameraStream.getVideoTracks()[0];
    if (cameraTrack && cameraTrack.readyState !== 'ended') return cameraTrack;
    const localVideoTrack = localStream && localStream.getVideoTracks()[0];
    if (localVideoTrack && localVideoTrack.readyState !== 'ended') return localVideoTrack;
    return null;
}

// ─── Audio mixer (mic + screen audio → single sender track) ───────
// During screen share we want both mic and tab/system audio transmitted on the
// single, already-negotiated audio sender. Web Audio mixes them into a single
// MediaStreamTrack which we hand to sender.replaceTrack(). No SDP renegotiation.
function createAudioMixer(micTrack, screenTrack) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) {
        console.warn('[Mixer] AudioContext unavailable');
        return null;
    }
    const ctx = new AC();
    // Best-effort: contexts created outside a gesture start suspended on some
    // browsers; resume is safe regardless of state.
    try { ctx.resume(); } catch {}
    const dest = ctx.createMediaStreamDestination();
    const mixer = {
        ctx, dest,
        micNode: null, micGainNode: null, micSrcStream: null,
        screenNode: null, screenGainNode: null, screenSrcStream: null,
        mixedTrack: dest.stream.getAudioTracks()[0]
    };
    setMixerMicTrack.call(mixer, micTrack, true);
    setMixerScreenTrack.call(mixer, screenTrack, true);
    return mixer;
}

// Both setters accept `this` (the mixer) so they can be reused for the global
// `audioMixer` via `.call(audioMixer, ...)` or during construction.
function setMixerMicTrack(track, _internal) {
    const m = _internal ? this : audioMixer;
    if (!m) return;
    if (m.micNode) {
        try { m.micNode.disconnect(); } catch {}
        m.micNode = null;
    }
    if (m.micGainNode) {
        try { m.micGainNode.disconnect(); } catch {}
        m.micGainNode = null;
    }
    m.micSrcStream = null;
    if (track && track.readyState !== 'ended') {
        try {
            m.micSrcStream = new MediaStream([track]);
            m.micNode = m.ctx.createMediaStreamSource(m.micSrcStream);
            m.micGainNode = m.ctx.createGain();
            m.micGainNode.gain.value = MIXER_MIC_GAIN;
            m.micNode.connect(m.micGainNode);
            m.micGainNode.connect(m.dest);
        } catch (e) {
            console.warn('[Mixer] failed to attach mic track', e);
            m.micNode = null;
            m.micGainNode = null;
            m.micSrcStream = null;
        }
    }
}

function setMixerScreenTrack(track, _internal) {
    const m = _internal ? this : audioMixer;
    if (!m) return;
    if (m.screenNode) {
        try { m.screenNode.disconnect(); } catch {}
        m.screenNode = null;
    }
    if (m.screenGainNode) {
        try { m.screenGainNode.disconnect(); } catch {}
        m.screenGainNode = null;
    }
    m.screenSrcStream = null;
    if (track && track.readyState !== 'ended') {
        try {
            m.screenSrcStream = new MediaStream([track]);
            m.screenNode = m.ctx.createMediaStreamSource(m.screenSrcStream);
            m.screenGainNode = m.ctx.createGain();
            m.screenGainNode.gain.value = MIXER_SCREEN_AUDIO_GAIN;
            m.screenNode.connect(m.screenGainNode);
            m.screenGainNode.connect(m.dest);
        } catch (e) {
            console.warn('[Mixer] failed to attach screen track', e);
            m.screenNode = null;
            m.screenGainNode = null;
            m.screenSrcStream = null;
        }
    }
}

async function destroyAudioMixer() {
    if (!audioMixer) return;
    const m = audioMixer;
    audioMixer = null;
    try { m.micNode?.disconnect(); } catch {}
    try { m.micGainNode?.disconnect(); } catch {}
    try { m.screenNode?.disconnect(); } catch {}
    try { m.screenGainNode?.disconnect(); } catch {}
    try { m.mixedTrack?.stop(); } catch {}
    try { await m.ctx.close(); } catch {}
}

function cancelPeerIceRestart(peer) {
    if (!peer?.iceRestartTimer) return;
    clearTimeout(peer.iceRestartTimer);
    peer.iceRestartTimer = null;
}

function schedulePeerIceRestart(peer) {
    if (!peer || peer.iceRestartTimer) return;
    peer.iceRestartTimer = setTimeout(() => {
        peer.iceRestartTimer = null;
        if (peer.pc.iceConnectionState === 'disconnected' || peer.pc.iceConnectionState === 'failed') {
