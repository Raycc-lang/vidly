<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1117" />
<title>Vidly — Private Video Calls</title>
<style>
  /* ─── Tokens ───────────────────────────────────────────── */
  :root {
    --bg: #0f1117;
    --bg-grad: radial-gradient(1200px 800px at 80% -10%, #1c2236 0%, transparent 60%),
               radial-gradient(900px 700px at -10% 110%, #1a1430 0%, transparent 55%),
               #0f1117;
    --card: #1a1d27;
    --card-2: #20242f;
    --border: #2a2f3d;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #8a6cff;
    --good: #34d399;
    --warn: #fbbf24;
    --bad:  #f87171;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    --radius: 14px;
    --radius-sm: 9px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                 Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }
  input, button { color: inherit; }

  /* ─── Landing ──────────────────────────────────────────── */
  #landing {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px;
  }
  .landing-card {
    width: min(440px, 100%);
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
    animation: pop .5s cubic-bezier(.2,.9,.3,1.2);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px;
    font-weight: 600; font-size: 14px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 12px rgba(79, 140, 255, .7);
  }
  .title {
    font-size: 34px; font-weight: 700; line-height: 1.1; margin: 0 0 8px;
    background: linear-gradient(90deg, #fff, #b9c8ff 60%, #c4a8ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); margin: 0 0 28px; font-size: 15px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 46px; padding: 0 18px;
    border: 1px solid transparent; border-radius: 10px;
    background: var(--card-2); color: var(--text);
    font-size: 15px; font-weight: 500;
    cursor: pointer; transition: transform .08s ease, background .15s ease, border-color .15s;
  }
  .btn:hover { background: #262b39; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: none;
    box-shadow: 0 6px 20px rgba(79, 140, 255, .35);
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { background: #b13c3c; color: #fff; }
  .btn.danger:hover { background: #c84a4a; }
  .btn.ghost { background: transparent; border-color: var(--border); }
  .btn.ghost:hover { background: rgba(255,255,255,.04); }
  .btn.icon { width: 46px; padding: 0; font-size: 18px; }
  .btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; }

  .full { width: 100%; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 12px;
    margin: 22px 0;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }

  .input {
    width: 100%; height: 46px; padding: 0 14px;
    background: #12151c; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,140,255,.2); }
  .row { display: flex; gap: 10px; }

  .footer-note { margin-top: 22px; color: var(--muted); font-size: 12px; text-align: center; }

  /* ─── Call screen ──────────────────────────────────────── */
  #call { display: none; height: 100vh; height: 100dvh; flex-direction: column; }
  #call.active { display: flex; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(8px);
    background: rgba(15, 17, 23, .65);
    z-index: 5;
  }
  .room-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 13px;
  }
  .room-pill code { color: var(--accent); font-family: "SF Mono", ui-monospace, monospace; }
  .copy-btn {
    background: none; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 12px;
  }
  .copy-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .top-actions { display: flex; gap: 8px; }

  .stage {
    flex: 1; display: flex; min-height: 0; position: relative;
  }
  .grid-wrap {
    flex: 1; min-width: 0; min-height: 0;
    padding: 18px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .grid {
    width: 100%; height: 100%;
    display: grid; gap: 14px;
    grid-template-columns: 1fr;
    grid-auto-rows: 1fr;
  }
  .grid.n2 { grid-template-columns: repeat(2, 1fr); }
  .grid.n3, .grid.n4 { grid-template-columns: repeat(2, 1fr); }

  .tile {
    position: relative; overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    animation: fadein .3s ease both;
    aspect-ratio: 16 / 9;
    max-height: 100%;
    align-self: center; justify-self: center;
    width: 100%;
  }
  .tile video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  .tile.placeholder::after {
    content: "Waiting for video…";
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); font-size: 13px;
  }
  .tile.placeholder video {
    display: none;
  }
  .tile-label {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
    padding: 6px 10px; border-radius: 8px;
    font-size: 12px; color: #fff;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
    box-shadow: 0 0 6px currentColor;
  }
  .status-dot.connected { background: var(--good); color: var(--good); }
  .status-dot.connecting { background: var(--warn); color: var(--warn); }
  .status-dot.failed { background: var(--bad); color: var(--bad); }

  .empty-state {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--muted); pointer-events: none;
  }
  .empty-state .icon { font-size: 42px; margin-bottom: 10px; opacity: .6; }

  /* Local PiP */
  #localTile {
    position: fixed;
    right: 22px; bottom: 110px;
    width: 350px; min-height: 100px; aspect-ratio: 16/9;
    border-radius: 12px; overflow: hidden;
    background: #000; border: 1px solid var(--border);
    box-shadow: 0 12px 32px rgba(0,0,0,.5);
    z-index: 6;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #localTile.dragging { cursor: grabbing; transition: none !important; }
  #localTile:not(.dragging) { transition: right .2s ease, bottom .2s ease; }
  #localTile video {
    width: 100%; height: 100%; object-fit: cover;
    transform: scaleX(-1); /* mirror */
  }
  #localTile.screensharing video { transform: none; }
  #localTile .tile-label { font-size: 11px; padding: 4px 8px; left: 8px; bottom: 8px; }

  /* Resize handles — invisible, positioned at corners */
  .resize-handle {
    position: absolute;
    width: 24px; height: 24px;
    z-index: 10;
    /* debug: background: rgba(255,0,0,.3); */
  }
  .resize-handle.nw { top: 0; left: 0; cursor: nw-resize; }
  .resize-handle.ne { top: 0; right: 0; cursor: ne-resize; }
  .resize-handle.sw { bottom: 0; left: 0; cursor: sw-resize; }
  .resize-handle.se { bottom: 0; right: 0; cursor: se-resize; }

  /* Local PiP placeholder */
  #localPlaceholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
    z-index: 2;
  }
  #localPlaceholder.hidden { display: none; }
  #localAvatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  #localPlaceholder .cam-on-btn {
    padding: 6px 14px; border-radius: 8px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; cursor: pointer;
    transition: background .15s;
  }
  #localPlaceholder .cam-on-btn:hover { background: rgba(255,255,255,.14); }
  #previewBtns {
    position: absolute; inset: 0; bottom: 0;
    display: none; flex-direction: column; align-items: center; justify-content: flex-end;
    padding-bottom: 8px; gap: 6px;
    background: linear-gradient(to top, rgba(0,0,0,.7) 0%, rgba(0,0,0,.4) 50%, transparent 100%);
    z-index: 3;
  }
  #previewBtns.active { display: flex; }
  #previewBtns .btn-row { display: flex; gap: 6px; align-items: center; }
  #previewBtns .btn-row button {
    padding: 5px 12px; border-radius: 6px; border: none;
    font-size: 11px; font-weight: 600; cursor: pointer;
    transition: filter .15s;
    display: inline-flex; align-items: center; gap: 4px;
    backdrop-filter: blur(4px);
  }
  #previewBtns .btn-row button:hover { filter: brightness(1.1); }
  #previewBtns .confirm-btn { background: var(--good); color: #000; }
  #previewBtns .cancel-btn { background: var(--bad); color: #fff; }
  #previewBtns .switch-cam-btn {
    background: rgba(255,255,255,.2); color: #fff;
    border: 1px solid rgba(255,255,255,.3);
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: rgba(15, 17, 23, .85);
    backdrop-filter: blur(10px);
    z-index: 7;
    flex-shrink: 0;
    position: sticky;
    bottom: 0;
  }
  .toolbar .btn.icon { height: 50px; width: 50px; font-size: 20px; border-radius: 12px; }
  .toolbar .btn.icon.muted { background: #3a2222; color: #ffb4b4; }

  /* Chat — unified preview + full panel */
  .chat {
    border-top: 1px solid var(--border);
    background: var(--card);
    flex-shrink: 0;
    overflow: hidden;
    transition: max-height .3s cubic-bezier(.4,0,.2,1);
    max-height: 60px;
    cursor: pointer;
  }
  .chat.open {
    max-height: 300px;
    cursor: default;
  }
  .chat-compact {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .chat-compact .cc-msg {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-compact .cc-sender {
    color: var(--accent);
    font-weight: 600;
    margin-right: 6px;
  }
  .chat-full {
    display: none;
    flex-direction: column;
    height: 300px;
  }
  .chat.open .chat-compact { display: none; }
  .chat.open .chat-full { display: flex; }
  .chat-head {
    padding: 12px 16px;
    font-weight: 600; font-size: 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .messages {
    flex: 1; overflow-y: auto;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 4px; }

  .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.35; word-wrap: break-word; animation: fadein .2s ease; }
  .msg .meta { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: .8; }
  .msg.own { align-self: flex-end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 4px; }
  .msg.other { align-self: flex-start; background: #262a36; border-bottom-left-radius: 4px; }
  .msg.system { align-self: center; background: transparent; color: var(--muted); font-size: 12px; font-style: italic; }
  .chat-input {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-input .input { height: 38px; font-size: 14px; }
  .chat-input .btn { height: 38px; }

  /* Toasts */
  #toasts {
    position: fixed; top: 18px; right: 18px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 100;
    pointer-events: none;
  }
  .toast {
    background: var(--card-2); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 12px 16px; border-radius: 10px;
    font-size: 14px; max-width: 340px;
    box-shadow: var(--shadow);
    animation: slidein .25s ease;
    pointer-events: auto;
  }
  .toast.error { border-left-color: var(--bad); }
  .toast.warn  { border-left-color: var(--warn); }
  .toast.success { border-left-color: var(--good); }

  /* Animations */
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  /* Mobile */
  @media (max-width: 720px) {
    .topbar { padding: 10px 12px; }
    .grid-wrap { padding: 10px; }
    .grid.n2, .grid.n3, .grid.n4 { grid-template-columns: 1fr; }
    #localTile {
      width: 170px; right: 12px; bottom: 92px;
      aspect-ratio: 3/4;
      display: block;
    }
    .toolbar .btn.icon { height: 44px; width: 44px; font-size: 18px; }
    .chat.open {
      max-height: 60vh;
    }
    .chat.open .chat-full {
      height: auto;
      flex: 1;
      min-height: 0;
    }
    .chat.open {
      position: fixed;
      inset: 0;
      max-height: none;
      z-index: 20;
    }
  }
</style>
</head>
<body>

<!-- ─── Landing page ─────────────────────────────────────── -->
<section id="landing">
  <div class="landing-card">
    <div class="brand"><span class="dot"></span> Vidly</div>
    <h1 class="title">Private video calls,<br/>just a link away.</h1>
    <p class="subtitle">Peer-to-peer, end-to-end. Up to 4 people. No accounts.</p>

    <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--muted);">Your name</label>
    <input id="usernameInput" class="input" placeholder="Enter your name..." autocomplete="off" maxlength="32"
           style="margin-bottom:18px;" />

    <button id="createBtn" class="btn primary full">＋ Create new room</button>

    <div class="divider">or join with a code</div>

    <div class="row">
      <input id="joinCode" class="input" placeholder="room code" autocomplete="off" />
      <button id="joinBtn" class="btn">Join →</button>
    </div>

    <p class="footer-note">Your camera and audio stream directly to other participants.</p>
  </div>
</section>

<!-- ─── Call page ────────────────────────────────────────── -->
<section id="call">
  <header class="topbar">
    <div class="room-pill">
      <span class="status-dot" id="wsDot"></span>
      Room <code id="roomLabel">—</code>
      <button class="copy-btn" id="copyLink" title="Copy invite link">⧉ copy</button>
    </div>
  </header>

  <div class="stage">
    <div class="grid-wrap">
      <div class="grid" id="grid"></div>
      <div class="empty-state" id="emptyState">
        <div>
          <div class="icon">👥</div>
          <div>Waiting for others to join…</div>
        </div>
      </div>
    </div>
  </div>

  <aside class="chat" id="chat">
    <div class="chat-compact" id="chatCompact">
      <!-- last 2 messages, shown when chat is closed -->
    </div>
    <div class="chat-full" id="chatFull">
      <div class="chat-head">
        <span>Chat</span>
        <button class="btn ghost" id="closeChat">✕</button>
      </div>
      <div class="messages" id="messages"></div>
      <form class="chat-input" id="chatForm">
        <input class="input" id="chatInput" placeholder="Type a message…" autocomplete="off" />
        <button class="btn primary" type="submit">Send</button>
      </form>
    </div>
  </aside>

  <div id="localTile">
    <video id="localVideo" autoplay playsinline muted style="display:none;"></video>
    <div id="localPlaceholder">
      <div id="localAvatar">Y</div>
      <button class="cam-on-btn" id="camOnBtn">📷 Turn on camera</button>
    </div>
    <div id="previewBtns">
      <div class="btn-row">
        <button class="switch-cam-btn" id="switchCamBtn" title="Switch camera">🔄</button>
        <button class="confirm-btn" id="confirmCamBtn">✓</button>
        <button class="cancel-btn" id="cancelCamBtn">✕</button>
      </div>
    </div>
    <div class="tile-label" id="localLabel">You</div>
    <div class="resize-handle nw" data-corner="nw"></div>
    <div class="resize-handle ne" data-corner="ne"></div>
    <div class="resize-handle sw" data-corner="sw"></div>
    <div class="resize-handle se" data-corner="se"></div>
  </div>

  <footer class="toolbar">
    <button class="btn icon" id="micBtn" title="Mute / unmute mic">🎙️</button>
    <button class="btn icon" id="camBtn" title="Camera on / off">📷</button>
    <button class="btn icon" id="screenBtn" title="Share screen">🖥️</button>
    <button class="btn icon" id="chatBtn" title="Toggle chat">💬</button>
    <button class="btn icon danger" id="leaveBtn" title="Leave call">⛔</button>
  </footer>
</section>

<div id="toasts"></div>

<script>
"use strict";

/* ──────────────────────────────────────────────────────────
   Vidly client — single-file vanilla JS WebRTC mesh client.
   ────────────────────────────────────────────────────────── */

// ─── State ────────────────────────────────────────────────
const peers = new Map(); // peerId -> { pc, dc, polite, makingOffer, ignoreOffer, videoEl, tileEl, remoteStream, dot }
let localStream = null;
let cameraStream = null;       // saved when screen sharing
let screenStream = null;
let screenAudioTrack = null;   // optional system/tab audio track from screen share
let isSharing = false;
let micEnabled = false;
let camEnabled = false;
let micStream = null;        // audio-only stream when mic is on but camera is off
let previewStream = null;    // preview stream during camera confirmation
let myPeerId = null;
let facingMode = 'user';     // 'user' = front camera, 'environment' = back camera
let myUsername = '';
let roomId = null;
let ws = null;
let wsBackoff = 1000;
let wsReconnectTimer = null;
let intentionalClose = false;
let iceServers = [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'stun:stun.cloudflare.com:3478' },
    { urls: 'stun:global.stun.twilio.com:3478' },
];

// ─── DOM refs ─────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const landing = $('landing'), call = $('call');
const grid = $('grid'), emptyState = $('emptyState');
const localVideo = $('localVideo'), localTile = $('localTile');
const localPlaceholder = $('localPlaceholder');
const localAvatar = $('localAvatar');
const previewBtns = $('previewBtns');
const messagesEl = $('messages');

// ─── Toast helper ─────────────────────────────────────────
function toast(message, type = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    $('toasts').appendChild(el);
    setTimeout(() => {
        el.style.transition = 'opacity .3s, transform .3s';
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 300);
    }, 3800);
}

// ─── Routing ──────────────────────────────────────────────
function route() {
    const m = location.pathname.match(/^\/room\/([A-Za-z0-9_-]+)$/);
    if (m) {
        roomId = m[1];
        showCall();
    } else {
        showLanding();
    }
}
function showLanding() {
    landing.style.display = 'grid';
    call.classList.remove('active');
}
async function showCall() {
    // Ensure we have a username
    if (!myUsername) {
        const saved = localStorage.getItem('vidly-username');
        if (saved) myUsername = saved;
    }
    if (!myUsername) {
        // No username available — redirect to landing
        toast('Please enter your name first', 'warn');
        $('joinCode').value = roomId;
        history.pushState({}, '', '/');
        showLanding();
        return;
    }
    landing.style.display = 'none';
    call.classList.add('active');
    $('roomLabel').textContent = roomId;
    $('localLabel').textContent = myUsername || 'You';
    updateChatCompact();
    await loadConfig();
    await initLocalMedia();
    connectWebSocket();
}

// ─── Landing handlers ─────────────────────────────────────
function randomRoomId(n = 8) {
    const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
    let out = '';
    const arr = new Uint32Array(n);
    crypto.getRandomValues(arr);
    for (let i = 0; i < n; i++) out += alphabet[arr[i] % alphabet.length];
    return out;
}
$('createBtn').onclick = () => {
    const name = $('usernameInput').value.trim();
    if (!name) { toast('Please enter your name', 'warn'); $('usernameInput').focus(); return; }
    myUsername = name;
    localStorage.setItem('vidly-username', name);
    const id = randomRoomId();
    history.pushState({}, '', '/room/' + id);
    roomId = id;
    showCall();
};
$('joinBtn').onclick = () => {
    const name = $('usernameInput').value.trim();
    if (!name) { toast('Please enter your name', 'warn'); $('usernameInput').focus(); return; }
    myUsername = name;
    localStorage.setItem('vidly-username', name);
    const v = $('joinCode').value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
    if (!v) { toast('Enter a room code', 'warn'); return; }

    showCall();
};

// ─── Server config (fetch TURN settings) ──────────────────
async function loadConfig() {
    try {
        const cfg = await (await fetch('/config')).json();
        if (cfg.turnUrl) {
            // TURN_URL format: "turn:HOST:PORT?username=USER&credential=PASS"
            // The "turn:" scheme isn't recognised by the URL constructor, so we
            // swap it for "https:" purely to get a parseable URL object.
            const url = new URL(cfg.turnUrl.replace(/^turn:/, 'https:'));
            const username = url.searchParams.get('username');
            const credential = url.searchParams.get('credential');
            iceServers.push({
                urls: 'turn:' + url.host + url.pathname.replace(/\/$/, ""),
                username, credential
            });
        }
    } catch (e) {
        console.warn('Failed to fetch /config', e);
    }
}

// ─── Local media ──────────────────────────────────────────
async function initLocalMedia() {
    // Camera and mic OFF by default — no permission prompt on load.
    localStream = new MediaStream();
    cameraStream = localStream;
    camEnabled = false;
    micEnabled = false;
    $('micBtn').classList.add('muted');
    $('micBtn').textContent = '🔇';
    $('camBtn').classList.add('muted');
    $('camBtn').textContent = '🚫';
    showLocalPlaceholder();
    localTile.style.display = 'none';
}

function showLocalPlaceholder() {
    localVideo.style.display = 'none';
    localPlaceholder.classList.remove('hidden');
    // Update avatar letter
    const letter = (myUsername || 'Y').charAt(0).toUpperCase();
    localAvatar.textContent = letter;
}

function hideLocalPlaceholder() {
    localPlaceholder.classList.add('hidden');
    localVideo.style.display = '';
}

async function previewCamera() {
    try {
        // Release audio device first if micStream exists (to avoid AbortError)
        if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        previewStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: facingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { ideal: 30 }
            },
            audio: { echoCancellation: true, noiseSuppression: true }
        });
        // Show preview in local video
        localVideo.srcObject = previewStream;
        localTile.style.display = '';
        localVideo.style.display = '';
        localPlaceholder.classList.add('hidden');
        previewBtns.classList.add('active');
    } catch (err) {
        console.error('[WebRTC] preview getUserMedia failed', err);
        let m = err.message || String(err);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
            m = 'Camera blocked: please allow camera/mic access in browser settings.';
        } else if (err.name === 'NotFoundError') {
            m = 'No camera or microphone found on this device.';
        } else if (err.name === 'NotReadableError') {
            m = 'Camera is in use by another application.';
        }
        toast(m, 'error');
    }
}

function confirmCamera() {
    previewBtns.classList.remove('active');
    if (!previewStream) return;

    // Promote preview to live
    cameraStream = previewStream;
    localStream = previewStream;
    previewStream = null;
    camEnabled = true;
    micEnabled = true;

    // Update button states
    $('camBtn').classList.remove('muted');
    $('camBtn').textContent = '📷';
    $('micBtn').classList.remove('muted');
    $('micBtn').textContent = '🎙️';

    localTile.style.display = '';

    // Replace tracks on existing senders (no renegotiation needed)
    for (const peer of peers.values()) {
        const senders = peer.pc.getSenders();
        const videoSender = senders.find(s => s.track?.kind === 'video');
        const audioSender = senders.find(s => s.track?.kind === 'audio');
        const newVideo = localStream.getVideoTracks()[0];
        const newAudio = localStream.getAudioTracks()[0];

        if (videoSender && newVideo) {
            try { videoSender.replaceTrack(newVideo); } catch {}
        } else if (!videoSender && newVideo) {
            try { peer.pc.addTrack(newVideo, localStream); } catch {}
        }
        if (audioSender && newAudio) {
            try { audioSender.replaceTrack(newAudio); } catch {}
        } else if (!audioSender && newAudio) {
            try { peer.pc.addTrack(newAudio, localStream); } catch {}
        }
    }

    toast('Camera and mic are now on', 'success');
}

function cancelCamera() {
    previewBtns.classList.remove('active');
    if (previewStream) {
        previewStream.getTracks().forEach(t => t.stop());
        previewStream = null;
    }
    localVideo.srcObject = null;
    showLocalPlaceholder();
    localTile.style.display = 'none';
}
// ─── Camera switch (front/back) ───────────────────────────
$('switchCamBtn').onclick = async () => {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    // If preview is active, restart it with the new facing mode
    if (previewStream) {
        previewStream.getTracks().forEach(t => t.stop());
        previewStream = null;
    }
    await previewCamera();
};

// ─── Draggable local tile ─────────────────────────────────
(function initDraggable() {
    let isDragging = false;
    let startX, startY, startRight, startBottom;
    let hasMoved = false;
    const rect0 = localTile.getBoundingClientRect();
    const computedAspect = getComputedStyle(localTile).aspectRatio;
    const aspectParts = computedAspect.split('/').map(v => parseFloat(v.trim()));
    const tileAspect = rect0.width && rect0.height
        ? rect0.width / rect0.height
        : (aspectParts.length === 2 && aspectParts.every(Number.isFinite) && aspectParts[1]
            ? aspectParts[0] / aspectParts[1]
            : 16 / 9);

    function getViewportBounds() {
        return {
            w: window.innerWidth,
            h: window.innerHeight
        };
    }

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    function onPointerDown(e) {
        // Only start drag from the tile itself, not from buttons inside it
        if (e.target.closest('.resize-handle')) return;
        if (e.target.closest('button') || e.target.closest('.btn')) return;
        isDragging = true;
        hasMoved = false;
        const pos = e.touches ? e.touches[0] : e;
        startX = pos.clientX;
        startY = pos.clientY;
        const rect = localTile.getBoundingClientRect();
        const vp = getViewportBounds();
        startRight = vp.w - rect.right;
        startBottom = vp.h - rect.bottom;
        localTile.classList.add('dragging');
        if (e.type === 'touchstart') e.preventDefault();
    }

    function onPointerMove(e) {
        if (!isDragging) return;
        const pos = e.touches ? e.touches[0] : e;
        const dx = pos.clientX - startX;
        const dy = pos.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) hasMoved = true;
        const vp = getViewportBounds();
        const rect = localTile.getBoundingClientRect();
        const tileW = rect.width || 200;
        const tileH = rect.height || 112;
        // Constrain to viewport — keep at least 60px of the tile visible
        const minVisible = 60;
        const newRight = clamp(startRight - dx, -(tileW - minVisible), vp.w - minVisible);
        const newBottom = clamp(startBottom - dy, -(tileH - minVisible), vp.h - minVisible);
        localTile.style.right = newRight + 'px';
        localTile.style.bottom = newBottom + 'px';
        localTile.style.left = 'auto';
        localTile.style.top = 'auto';
        if (e.type === 'touchmove') e.preventDefault();
    }

    function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        localTile.classList.remove('dragging');
        // Save position to sessionStorage
        if (hasMoved) {
            sessionStorage.setItem('vidly-pip-right', localTile.style.right);
            sessionStorage.setItem('vidly-pip-bottom', localTile.style.bottom);
        }
        // Ensure tile is visible after drag — snap back if off-screen
        const vp = getViewportBounds();
        const rect = localTile.getBoundingClientRect();
        if (rect.right < 20 || rect.bottom < 20 || rect.left > vp.w - 20 || rect.top > vp.h - 20) {
            localTile.style.right = '22px';
            localTile.style.bottom = '110px';
            localTile.style.left = 'auto';
            localTile.style.top = 'auto';
            sessionStorage.removeItem('vidly-pip-right');
            sessionStorage.removeItem('vidly-pip-bottom');
        }
    }

    // ─── Resize handles ──────────────────────────────
    const MIN_W = 120, MAX_W = 600;
    const handles = localTile.querySelectorAll('.resize-handle');
    let isResizing = false;
    let resizeCorner = '';
    let resizeStartX, resizeStartY, resizeStartW, resizeStartH, resizeStartRight;

    function onResizeDown(e) {
        e.stopPropagation(); // don't trigger drag
        isResizing = true;
        resizeCorner = e.target.dataset.corner;
        const pos = e.touches ? e.touches[0] : e;
        resizeStartX = pos.clientX;
        resizeStartY = pos.clientY;
        const rect = localTile.getBoundingClientRect();
        resizeStartW = rect.width;
        resizeStartH = rect.height;
        resizeStartRight = getViewportBounds().w - rect.right;
        localTile.style.aspectRatio = '';
        if (e.type === 'touchstart') e.preventDefault();
    }

    function onResizeMove(e) {
        if (!isResizing) return;
        const pos = e.touches ? e.touches[0] : e;
        const dx = pos.clientX - resizeStartX;
        const dy = pos.clientY - resizeStartY;

        let newW;
        if (resizeCorner === 'se' || resizeCorner === 'ne') {
            newW = resizeStartW + dx;
        } else {
            newW = resizeStartW - dx;
        }
        newW = Math.max(MIN_W, Math.min(MAX_W, newW));
        const newH = newW / tileAspect;

        localTile.style.width = newW + 'px';
        localTile.style.height = newH + 'px';

        // Reposition if resizing from left corners (nw/sw)
        if (resizeCorner === 'nw' || resizeCorner === 'sw') {
            localTile.style.right = (resizeStartRight + (resizeStartW - newW)) + 'px';
        }

        if (e.type === 'touchmove') e.preventDefault();
    }

    function onResizeUp() {
        if (!isResizing) return;
        isResizing = false;
        // Save size
        sessionStorage.setItem('vidly-pip-w', localTile.style.width);
        sessionStorage.setItem('vidly-pip-h', localTile.style.height);
    }

    // Mouse events
    localTile.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);

    // Touch events
    localTile.addEventListener('touchstart', onPointerDown, { passive: false });
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerUp);

    handles.forEach(h => {
        h.addEventListener('mousedown', onResizeDown);
        h.addEventListener('touchstart', onResizeDown, { passive: false });
    });
    document.addEventListener('mousemove', onResizeMove);
    document.addEventListener('touchmove', onResizeMove, { passive: false });
    document.addEventListener('mouseup', onResizeUp);
    document.addEventListener('touchend', onResizeUp);

    // Restore saved position
    const savedRight = sessionStorage.getItem('vidly-pip-right');
    const savedBottom = sessionStorage.getItem('vidly-pip-bottom');
    if (savedRight && savedBottom) {
        localTile.style.right = savedRight;
        localTile.style.bottom = savedBottom;
    }

    // Restore saved size
    const savedW = sessionStorage.getItem('vidly-pip-w');
    const savedH = sessionStorage.getItem('vidly-pip-h');
    if (savedW && savedH) {
        localTile.style.width = savedW;
        localTile.style.height = savedH;
        localTile.style.aspectRatio = '';
    }
})();

// ─── WebSocket signaling ──────────────────────────────────
function connectWebSocket() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');
    setWsDot('connecting');

    ws.onopen = () => {
        wsBackoff = 1000;
        setWsDot('connected');
    };

    ws.onmessage = (e) => {
        let msg;
        try { msg = JSON.parse(e.data); } catch { return; }
        handleSignaling(msg);
    };

    ws.onclose = () => {
        setWsDot('failed');
        if (intentionalClose) return;
        if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
        wsReconnectTimer = setTimeout(() => {
            wsBackoff = Math.min(wsBackoff * 2, 10000);
            connectWebSocket();
        }, wsBackoff);
    };

    ws.onerror = () => { /* close handler will retry */ };
}

function setWsDot(state) {
    const dot = $('wsDot');
    dot.className = 'status-dot ' + state;
}

function sendWs(obj) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
    }
}

function handleSignaling(msg) {
    switch (msg.type) {
        case 'welcome':
            myPeerId = msg.peerId;
            // Send username to server first, then join the room.
            sendWs({ type: 'set-username', username: myUsername });
            sendWs({ type: 'join', roomId, username: myUsername });
            break;

        case 'joined':
            // We are the joining peer — we initiate offers to existing peers.
            // Joining peer is "impolite" to avoid glare with simultaneous offers.
            for (const p of msg.peers) {
                ensurePeer(p.peerId, /*polite*/ false, /*createDC*/ true, p.username);
            }
            updateEmptyState();
            break;

        case 'peer-joined':
            // We're an existing peer — wait for the joiner's offer.
            // Existing peer is "polite".
            ensurePeer(msg.peerId, /*polite*/ true, /*createDC*/ false, msg.username);
            toast((msg.username || 'Someone') + ' joined the call', 'success');
            updateEmptyState();
            break;

        case 'peer-left':
            removePeer(msg.peerId);
            toast((msg.username || 'A participant') + ' left', '');
            updateEmptyState();
            break;

        case 'signal':
            onPeerSignal(msg.from, msg.payload);
            break;

        case 'room-full':
            toast('Room is full (max 4 people)', 'error');
            setTimeout(() => { intentionalClose = true; ws && ws.close(); leaveCall(); }, 2000);
            break;
    }
}

// ─── Peer management ──────────────────────────────────────
function ensurePeer(peerId, polite, createDC, username) {
    let peer = peers.get(peerId);
    if (peer) return peer;

    const pc = new RTCPeerConnection({ iceServers });
    const remoteStream = new MediaStream();
    const { tileEl, videoEl, dot } = createTile(peerId, username);
    videoEl.srcObject = remoteStream;

    peer = {
        pc, dc: null, polite,
        makingOffer: false, ignoreOffer: false,
        videoEl, tileEl, remoteStream, dot,
        username: username || null
    };
    peers.set(peerId, peer);

    // Add our local tracks to the connection.
    if (localStream) {
        for (const track of localStream.getTracks()) {
            pc.addTrack(track, localStream);
        }
    }
    // Also add mic-only stream if camera is off but mic is on.
    if (micStream) {
        for (const track of micStream.getTracks()) {
            pc.addTrack(track, micStream);
        }
    }

    // ICE candidates → ship to peer via signaling server.
    pc.onicecandidate = (e) => {
        if (e.candidate) sendSignal(peerId, { candidate: e.candidate });
    };

    // Remote tracks → attach to remote MediaStream feeding the <video>.
    pc.ontrack = (e) => {
        console.log('[WebRTC] ontrack:', e.track.kind, e.track.id, 'readyState:', e.track.readyState);
        const track = e.track;

        // If this is a video track and we already have one, replace it (handles
        // the case where peer re-enables camera after turning it off).
        if (track.kind === 'video') {
            const existing = remoteStream.getVideoTracks()[0];
            if (existing) {
                remoteStream.removeTrack(existing);
            }
            remoteStream.addTrack(track);
            videoEl.srcObject = remoteStream;
            videoEl.style.display = '';
            tileEl.classList.remove('placeholder');

            // When sender replaces track with null (camera off), track goes muted.
            // Show placeholder so the video doesn't freeze on last frame.
            track.onmute = () => {
                tileEl.classList.add('placeholder');
                videoEl.style.display = 'none';
            };
            // When sender provides a new track (camera back on), un-mute fires.
            track.onunmute = () => {
                tileEl.classList.remove('placeholder');
                videoEl.style.display = '';
            };
        } else {
            // Audio track — just add it
            remoteStream.addTrack(track);
        }

        track.onended = () => {
            try { remoteStream.removeTrack(track); } catch {}
        };
    };

    // Update connection-status dot in the tile label.
    pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if (s === 'connected') {
            dot.className = 'status-dot connected';
        } else if (s === 'connecting' || s === 'new') {
            dot.className = 'status-dot connecting';
        } else if (s === 'failed' || s === 'disconnected' || s === 'closed') {
            dot.className = 'status-dot failed';
            if (s === 'failed') toast('Connection to a peer failed', 'error');
        }
    };

    // ICE failure → try restartIce().
    pc.oniceconnectionstatechange = () => {
        if (pc.iceConnectionState === 'failed') {
            try { pc.restartIce(); } catch {}
        }
    };

    /*
     * Perfect-negotiation: only one side initiates SDP, the other reacts.
     * The joining peer is "impolite" (polite=false) and creates the offer.
     * onnegotiationneeded fires automatically when addTrack (above) modifies
     * the transceiver set.
     */
    pc.onnegotiationneeded = async () => {
        try {
            peer.makingOffer = true;
            await pc.setLocalDescription();
            sendSignal(peerId, { description: pc.localDescription });
        } catch (err) {
            console.error('negotiationneeded failed', err);
        } finally {
            peer.makingOffer = false;
        }
    };

    // DataChannel — created by the offerer (joining peer), received by answerer.
    if (createDC) {
        const dc = pc.createDataChannel('chat');
        attachDataChannel(peer, dc);
    }
    pc.ondatachannel = (e) => attachDataChannel(peer, e.channel);

    return peer;
}

async function onPeerSignal(fromId, payload) {
    // If we don't yet know this peer (e.g., they joined and offered before we
    // got the peer-joined message), create as polite=true since we're existing.
    let peer = peers.get(fromId);
    if (!peer) peer = ensurePeer(fromId, /*polite*/ true, /*createDC*/ false);
    const { pc } = peer;

    try {
        if (payload.description) {
            const desc = payload.description;
            const offerCollision = desc.type === 'offer' &&
                (peer.makingOffer || pc.signalingState !== 'stable');
            peer.ignoreOffer = !peer.polite && offerCollision;
            if (peer.ignoreOffer) return;

            await pc.setRemoteDescription(desc);
            if (desc.type === 'offer') {
                await pc.setLocalDescription();
                sendSignal(fromId, { description: pc.localDescription });
            }
        } else if (payload.candidate) {
            try {
                await pc.addIceCandidate(payload.candidate);
            } catch (err) {
                if (!peer.ignoreOffer) console.warn('addIceCandidate failed', err);
            }
        }
    } catch (err) {
        console.error('onPeerSignal error', err);
    }
}

function sendSignal(to, payload) {
    sendWs({ type: 'signal', to, payload });
}

function removePeer(peerId) {
    const peer = peers.get(peerId);
    if (!peer) return;
    try { peer.pc.close(); } catch {}
    if (peer.tileEl && peer.tileEl.parentNode) peer.tileEl.parentNode.removeChild(peer.tileEl);
    peers.delete(peerId);
    layoutGrid();
}

// ─── Tile / grid rendering ────────────────────────────────
function createTile(peerId, username) {
    const tile = document.createElement('div');
    tile.className = 'tile placeholder';
    tile.dataset.peerId = peerId;

    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    tile.appendChild(video);

    const label = document.createElement('div');
    label.className = 'tile-label';
    const dot = document.createElement('span');
    dot.className = 'status-dot connecting';
    label.appendChild(dot);
    const txt = document.createElement('span');
    txt.textContent = username || ('Peer ' + peerId.slice(0, 4));
    label.appendChild(txt);
    tile.appendChild(label);

    grid.appendChild(tile);
    layoutGrid();
    return { tileEl: tile, videoEl: video, dot };
}

function layoutGrid() {
    const n = peers.size;
    grid.classList.remove('n2', 'n3', 'n4');
    if (n >= 2) grid.classList.add('n' + Math.min(n, 4));
}

function updateEmptyState() {
    emptyState.style.display = peers.size === 0 ? 'grid' : 'none';
}

// ─── DataChannel chat ─────────────────────────────────────
function attachDataChannel(peer, dc) {
    peer.dc = dc;
    dc.onopen = () => {};
    dc.onmessage = (e) => {
        let msg; try { msg = JSON.parse(e.data); } catch { return; }
        if (msg.type === 'chat') addMessage('other', msg.body, msg.ts, msg.username);
    };
    dc.onclose = () => {};
}

function broadcastChat(text) {
    const msg = { type: 'chat', body: text, ts: Date.now(), username: myUsername };
    const data = JSON.stringify(msg);
    for (const peer of peers.values()) {
        if (peer.dc && peer.dc.readyState === 'open') {
            try { peer.dc.send(data); } catch {}
        }
    }
}

function addMessage(kind, body, ts, senderName) {
    const el = document.createElement('div');
    el.className = 'msg ' + kind;
    // Show sender name for incoming messages
    if (kind === 'other' && senderName) {
        const nameEl = document.createElement('div');
        nameEl.className = 'meta';
        nameEl.textContent = senderName;
        nameEl.style.marginBottom = '4px';
        nameEl.style.marginTop = '0';
        nameEl.style.color = 'var(--accent)';
        el.appendChild(nameEl);
    }
    const bodyEl = document.createElement('span');
    bodyEl.textContent = body;
    el.appendChild(bodyEl);
    if (ts) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        const d = new Date(ts);
        meta.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        el.appendChild(meta);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (kind === 'own' || kind === 'other') {
        updateChatCompact();
    }
}

function updateChatCompact() {
    const compact = $('chatCompact');
    if (!compact) return;
    // Don't update while chat is open (user is reading full messages)
    if ($('chat').classList.contains('open')) return;

    compact.innerHTML = '';
    // Show last 2 messages
    const msgs = messagesEl.querySelectorAll('.msg.own, .msg.other');
    const last2 = Array.from(msgs).slice(-2);
    if (last2.length === 0) {
        compact.textContent = 'No messages yet';
        return;
    }
    for (const m of last2) {
        const row = document.createElement('div');
        row.className = 'cc-msg';
        const sender = m.classList.contains('own') ? 'You' :
            (m.querySelector('.meta')?.textContent || 'Peer');
        const body = m.querySelector('span:not(.meta)')?.textContent || '';
        const s = document.createElement('span');
        s.className = 'cc-sender';
        s.textContent = sender + ':';
        row.appendChild(s);
        const t = document.createElement('span');
        t.textContent = body.length > 50 ? body.slice(0, 50) + '…' : body;
        row.appendChild(t);
        compact.appendChild(row);
    }
}

$('chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('chatInput').value.trim();
    if (!v) return;
    broadcastChat(v);
    addMessage('own', v, Date.now());
    $('chatInput').value = '';
});

// ─── Toolbar controls ─────────────────────────────────────
$('micBtn').onclick = async () => {
    if (micEnabled) {
        // Turn mic off
        micEnabled = false;
        if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
        }
        if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = false; });
        $('micBtn').classList.add('muted');
        $('micBtn').textContent = '🔇';
    } else {
        // Turn mic on — camera is off, so request audio-only stream
        if (!camEnabled) {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                micEnabled = true;
                const audioTrack = micStream.getAudioTracks()[0];
                for (const peer of peers.values()) {
                    const sender = peer.pc.getSenders().find(s => s.track?.kind === 'audio');
                    if (sender) {
                        try { sender.replaceTrack(audioTrack); } catch {}
                    } else if (audioTrack) {
                        try { peer.pc.addTrack(audioTrack, micStream); } catch {}
                    }
                }
            } catch (err) {
                console.error('[WebRTC] mic getUserMedia failed', err);
                toast('Could not access microphone: ' + (err.message || err.name), 'error');
                return;
            }
        } else {
            // Camera is on — just re-enable existing audio tracks
            micEnabled = true;
            if (localStream) localStream.getAudioTracks().forEach(t => { t.enabled = true; });
        }
        $('micBtn').classList.remove('muted');
        $('micBtn').textContent = '🎙️';
    }
};
$('camBtn').onclick = () => {
    if (!camEnabled) {
        previewCamera();
    } else {
        // Turn camera off
        camEnabled = false;
        // Stop camera tracks
        if (cameraStream && cameraStream !== localStream) {
            // cameraStream is separate from localStream only in edge cases
        }
        if (localStream) localStream.getVideoTracks().forEach(t => t.stop());
        // Stop sending video without renegotiating.
        for (const peer of peers.values()) {
            const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
            if (sender) try { sender.replaceTrack(null); } catch {}
        }
        // Keep audio if mic is on
        if (micEnabled && micStream) {
            // micStream has the audio; it's already published
        }
        localVideo.srcObject = null;
        showLocalPlaceholder();
        localTile.style.display = 'none';
        $('camBtn').classList.add('muted');
        $('camBtn').textContent = '🚫';
    }
};

$('camOnBtn').onclick = previewCamera;
$('confirmCamBtn').onclick = confirmCamera;
$('cancelCamBtn').onclick = cancelCamera;

$('screenBtn').onclick = async () => {
    if (isSharing) await stopScreenShare();
    else await startScreenShare();
};

async function startScreenShare() {
    try {
        // Request screen audio too — gracefully falls back if unsupported.
        screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
    } catch (err) {
        toast('Could not start screen share: ' + (err.message || err.name), 'error');
        return;
    }
    const screenTrack = screenStream.getVideoTracks()[0];

    // Replace the outgoing video track for every peer.
    for (const peer of peers.values()) {
        const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
        if (sender) {
            try { await sender.replaceTrack(screenTrack); } catch (e) { console.warn(e); }
        } else {
            try { peer.pc.addTrack(screenTrack, screenStream); } catch (e) { console.warn(e); }
        }
    }

    // If screen audio is available, add it to all peer connections.
    screenAudioTrack = screenStream.getAudioTracks()[0] || null;
    if (screenAudioTrack) {
        for (const peer of peers.values()) {
            try { peer.pc.addTrack(screenAudioTrack, screenStream); } catch (e) { console.warn(e); }
        }
    }

    // Show local screen preview (un-mirrored).
    localVideo.srcObject = screenStream;
    localTile.style.display = '';
    localVideo.style.display = '';
    localPlaceholder.classList.add('hidden');
    localTile.classList.add('screensharing');
    isSharing = true;
    $('screenBtn').classList.add('active');

    // Auto-revert when user clicks "Stop sharing" in the browser UI.
    screenTrack.onended = () => stopScreenShare();
}

async function stopScreenShare() {
    // Remove screen audio track from all peer connections.
    if (screenAudioTrack) {
        for (const peer of peers.values()) {
            const sender = peer.pc.getSenders().find(s => s.track === screenAudioTrack);
            if (sender) {
                try { await sender.replaceTrack(null); } catch (e) { console.warn(e); }
            }
        }
        screenAudioTrack = null;
    }
    if (screenStream) {
        screenStream.getTracks().forEach(t => t.stop());
        screenStream = null;
    }
    if (camEnabled) {
        const camTrack = cameraStream && cameraStream.getVideoTracks()[0];
        for (const peer of peers.values()) {
            const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
            if (sender && camTrack) {
                try { await sender.replaceTrack(camTrack); } catch (e) { console.warn(e); }
            }
        }
        localVideo.srcObject = cameraStream;
    } else {
        // Camera was off — stop sending video, hide placeholder tile
        for (const peer of peers.values()) {
            const sender = peer.pc.getSenders().find(s => s.track?.kind === 'video');
            if (sender) try { sender.replaceTrack(null); } catch (e) { console.warn(e); }
        }
        localVideo.srcObject = null;
        showLocalPlaceholder();
        localTile.style.display = 'none';
    }
    localTile.classList.remove('screensharing');
    isSharing = false;
    $('screenBtn').classList.remove('active');
}

$('leaveBtn').onclick = leaveCall;

function leaveCall() {
    intentionalClose = true;
    try { sendWs({ type: 'leave' }); } catch {}
    for (const id of Array.from(peers.keys())) removePeer(id);
    if (ws) try { ws.close(); } catch {}
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (screenStream) screenStream.getTracks().forEach(t => t.stop());
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (previewStream) previewStream.getTracks().forEach(t => t.stop());
    history.pushState({}, '', '/');
    location.reload();
}

window.addEventListener('beforeunload', () => {
    try { sendWs({ type: 'leave' }); } catch {}
    if (ws) try { ws.close(); } catch {}
});

// ─── Chat panel toggle ────────────────────────────────────
function toggleChat() {
    const chat = $('chat');
    chat.classList.toggle('open');
    if (chat.classList.contains('open')) {
        // Scroll to bottom when opening
        messagesEl.scrollTop = messagesEl.scrollHeight;
    } else {
        // Update compact view when closing
        updateChatCompact();
    }
}
$('chatBtn').onclick = toggleChat;
$('closeChat').onclick = (e) => {
    e.stopPropagation();
    $('chat').classList.remove('open');
    updateChatCompact();
};
$('chat').addEventListener('click', (e) => {
    if (!$('chat').classList.contains('open')) {
        toggleChat();
    }
});

$('copyLink').onclick = async () => {
    const link = location.origin + '/room/' + roomId;
    try {
        await navigator.clipboard.writeText(link);
        toast('Invite link copied', 'success');
    } catch {
        prompt('Copy this invite link:', link);
    }
};
