name = "vidly-signal"
main = "src/worker.js"
compatibility_date = "2025-06-01"

workers_dev = true

# Durable Object for room-based WebSocket signaling
[[durable_objects.bindings]]
name = "ROOM_DO"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# TURN key (set via `npx wrangler secret put TURN_KEY_ID`)
# TURN key API token (set via `npx wrangler secret put TURN_KEY_API_TOKEN`)
# Optional: GIPHY API key (set via `npx wrangler secret put GIPHY_API_KEY`)
# Optional: TURN credential TTL in seconds
# Note: turn.cloudflare.com STUN is free + unlimited — no key needed for STUN